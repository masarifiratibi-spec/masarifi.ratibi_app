openapi: 3.1.0
info:
  title: Masarifi Admin Support, Content, and Notifications Mock Contract
  version: 0.1.0
  description: >
    Proposed frontend contract for Phase 6. It defines mock HTTP behavior only;
    no backend, provider, storage, queue, file transfer, or delivery is implemented.
servers:
  - url: /api/v1/admin

paths:
  /support/overview:
    get:
      operationId: getSupportOverview
      parameters:
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/Period"
        - $ref: "#/components/parameters/Scenario"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          description: Privacy-safe support metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportOverview"
        "400":
          $ref: "#/components/responses/SafeError"
        "401":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "500":
          $ref: "#/components/responses/SafeError"

  /support/tickets:
    get:
      operationId: listSupportTickets
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Scenario"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TicketState"
        - name: priority
          in: query
          schema:
            $ref: "#/components/schemas/TicketPriority"
        - name: assignedAgent
          in: query
          schema:
            type: string
            maxLength: 48
        - name: type
          in: query
          schema:
            type: string
            maxLength: 80
        - name: categoryId
          in: query
          schema:
            $ref: "#/components/schemas/SupportCategoryId"
        - name: appVersion
          in: query
          schema:
            type: string
            maxLength: 40
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/SortOrder"
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, updated_at, priority, sla]
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          description: Role-projected ticket page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketPage"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"

  /support/tickets/{ticketId}:
    get:
      operationId: getSupportTicket
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/Scenario"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          description: Sanitized ticket detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "404":
          $ref: "#/components/responses/SafeError"

  /support/tickets/{ticketId}/actions:
    post:
      operationId: actOnSupportTicket
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketActionRequest"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          $ref: "#/components/responses/ActionSuccess"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "409":
          $ref: "#/components/responses/SafeError"

  /support/categories:
    get:
      operationId: listSupportCategories
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Scenario"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          description: Support categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportCategoryPage"
        "403":
          $ref: "#/components/responses/SafeError"
    post:
      operationId: createSupportCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportCategorySaveRequest"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          $ref: "#/components/responses/ActionSuccess"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"

  /support/categories/{categoryId}/actions:
    post:
      operationId: actOnSupportCategory
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportCategoryActionRequest"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          $ref: "#/components/responses/ActionSuccess"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "409":
          $ref: "#/components/responses/SafeError"

  /feedback:
    get:
      operationId: listFeedback
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Scenario"
        - name: type
          in: query
          schema:
            type: string
            enum: [general, bug, feature_request, ai, import]
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/FeedbackState"
        - name: appVersion
          in: query
          schema:
            type: string
            maxLength: 40
        - name: rating
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/SortOrder"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          description: Feedback overview and page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackPage"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"

  /feedback/{feedbackId}:
    get:
      operationId: getFeedback
      parameters:
        - $ref: "#/components/parameters/FeedbackId"
        - $ref: "#/components/parameters/Scenario"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          description: Sanitized feedback detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackDetail"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "404":
          $ref: "#/components/responses/SafeError"

  /feedback/{feedbackId}/actions:
    post:
      operationId: actOnFeedback
      parameters:
        - $ref: "#/components/parameters/FeedbackId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackActionRequest"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          $ref: "#/components/responses/ActionSuccess"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "409":
          $ref: "#/components/responses/SafeError"

  /feedback/abuse-reports:
    get:
      operationId: listAbuseReports
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Scenario"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/AbuseState"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          description: Restricted abuse-report page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbuseReportPage"
        "403":
          $ref: "#/components/responses/SafeError"

  /feedback/abuse-reports/{reportId}/actions:
    post:
      operationId: actOnAbuseReport
      parameters:
        - $ref: "#/components/parameters/AbuseReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbuseActionRequest"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          $ref: "#/components/responses/ActionSuccess"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "409":
          $ref: "#/components/responses/SafeError"

  /content/{collection}:
    get:
      operationId: listContent
      parameters:
        - $ref: "#/components/parameters/ContentCollection"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Scenario"
        - name: locale
          in: query
          schema:
            $ref: "#/components/schemas/Locale"
        - name: categoryId
          in: query
          schema:
            $ref: "#/components/schemas/CategoryId"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ContentState"
        - $ref: "#/components/parameters/SortOrder"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          description: Content collection page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPage"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
    post:
      operationId: createContent
      parameters:
        - $ref: "#/components/parameters/ContentCollection"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentSaveRequest"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          $ref: "#/components/responses/ActionSuccess"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"

  /content/{collection}/{itemId}:
    get:
      operationId: getContent
      parameters:
        - $ref: "#/components/parameters/ContentCollection"
        - $ref: "#/components/parameters/ContentItemId"
        - $ref: "#/components/parameters/Scenario"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          description: Content item detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "404":
          $ref: "#/components/responses/SafeError"

  /content/{collection}/{itemId}/actions:
    post:
      operationId: actOnContent
      parameters:
        - $ref: "#/components/parameters/ContentCollection"
        - $ref: "#/components/parameters/ContentItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentActionRequest"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          $ref: "#/components/responses/ActionSuccess"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "409":
          $ref: "#/components/responses/SafeError"

  /communications/templates:
    get:
      operationId: listTemplates
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/Scenario"
        - name: channel
          in: query
          schema:
            $ref: "#/components/schemas/Channel"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          description: Template page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplatePage"
        "403":
          $ref: "#/components/responses/SafeError"
    post:
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateSaveRequest"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          $ref: "#/components/responses/ActionSuccess"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"

  /communications/templates/{templateId}/actions:
    post:
      operationId: actOnTemplate
      parameters:
        - $ref: "#/components/parameters/TemplateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateActionRequest"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          $ref: "#/components/responses/ActionSuccess"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "409":
          $ref: "#/components/responses/SafeError"

  /notifications/overview:
    get:
      operationId: getNotificationOverview
      parameters:
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/Period"
        - $ref: "#/components/parameters/Scenario"
        - name: channel
          in: query
          schema:
            $ref: "#/components/schemas/Channel"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          description: Notification outcome metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationOverview"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"

  /notifications/audience-preview:
    post:
      operationId: previewNotificationAudience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudiencePreviewRequest"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          description: Authoritative aggregate audience preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudienceSummary"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"

  /notifications/campaigns:
    get:
      operationId: listCampaigns
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/Scenario"
        - name: channel
          in: query
          schema:
            $ref: "#/components/schemas/Channel"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/CampaignState"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          description: Campaign page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignPage"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
    post:
      operationId: createCampaignDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignDraftRequest"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          $ref: "#/components/responses/ActionSuccess"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"

  /notifications/campaigns/{campaignId}:
    get:
      operationId: getCampaign
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - $ref: "#/components/parameters/Scenario"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          description: Campaign detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "404":
          $ref: "#/components/responses/SafeError"

  /notifications/campaigns/{campaignId}/actions:
    post:
      operationId: actOnCampaign
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignActionRequest"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          $ref: "#/components/responses/ActionSuccess"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "409":
          $ref: "#/components/responses/SafeError"

  /notifications/transactional:
    get:
      operationId: listTransactionalTemplates
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/Scenario"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          description: Transactional template page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplatePage"
        "403":
          $ref: "#/components/responses/SafeError"

  /notifications/delivery-logs:
    get:
      operationId: listDeliveryLogs
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/Scenario"
        - name: channel
          in: query
          schema:
            $ref: "#/components/schemas/Channel"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DeliveryState"
        - name: templateId
          in: query
          schema:
            $ref: "#/components/schemas/TemplateId"
        - name: campaignId
          in: query
          schema:
            $ref: "#/components/schemas/CampaignId"
        - name: failureClass
          in: query
          schema:
            type: string
            enum: [none, consent, token, provider, validation, rate_limit, unavailable, internal]
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/SortOrder"
      responses:
        default:
          $ref: "#/components/responses/SafeError"
        "200":
          description: Privacy-safe delivery log page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryLogPage"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"

components:
  parameters:
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 120
    Platform:
      name: platform
      in: query
      schema:
        $ref: "#/components/schemas/Platform"
    Period:
      name: period
      in: query
      schema:
        type: string
        enum: [7d, 30d, 90d]
        default: 30d
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        enum: [25, 50, 100]
        default: 25
    DateFrom:
      name: dateFrom
      in: query
      schema:
        type: string
        format: date
    DateTo:
      name: dateTo
      in: query
      schema:
        type: string
        format: date
    SortOrder:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    Scenario:
      name: __scenario
      in: query
      schema:
        type: string
        enum: [default, empty, large, slow, partial, unauthorized, forbidden, not-found, validation, conflict, rate-limited, unavailable, error]
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/TicketId"
    FeedbackId:
      name: feedbackId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/FeedbackId"
    AbuseReportId:
      name: reportId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AbuseReportId"
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SupportCategoryId"
    ContentCollection:
      name: collection
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ContentCollection"
    ContentItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ContentItemId"
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/TemplateId"
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CampaignId"

  responses:
    SafeError:
      description: Safe bounded error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ActionSuccess:
      description: Deterministic mock action result
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ActionResult"

  schemas:
    Timestamp:
      type: string
      format: date-time
    Platform:
      type: string
      enum: [all, ios, android, unknown]
    Locale:
      type: string
      enum: [ar, en]
    Channel:
      type: string
      enum: [email, push, in_app]
    AccessLevel:
      type: string
      enum: [full, aggregate, linked, restricted]
    TicketId:
      type: string
      pattern: "^TKT-[A-Z0-9-]{1,44}$"
    FeedbackId:
      type: string
      pattern: "^FDB-[A-Z0-9-]{1,44}$"
    AbuseReportId:
      type: string
      pattern: "^ABR-[A-Z0-9-]{1,44}$"
    SupportCategoryId:
      type: string
      pattern: "^SUPC-[A-Z0-9-]{1,43}$"
    CategoryId:
      type: string
      pattern: "^CAT-[A-Z0-9-]{1,44}$"
    ContentItemId:
      type: string
      pattern: "^(CNT|CAT)-[A-Z0-9-]{1,43}$"
    TemplateId:
      type: string
      pattern: "^TPL-[A-Z0-9-]{1,44}$"
    CampaignId:
      type: string
      pattern: "^CMP-[A-Z0-9-]{1,44}$"
    MaskedReference:
      type: string
      maxLength: 48
      pattern: "^[A-Z]{2,8}-MASK-[A-Z0-9-]{1,32}$"
    ContentCollection:
      type: string
      enum: [default_categories, financial_tips, faqs, onboarding, help_center, announcements]
    TicketPriority:
      type: string
      enum: [low, medium, high, urgent]
    TicketState:
      type: string
      enum: [new, open, awaiting_customer, awaiting_agent, resolved, closed]
    FeedbackState:
      type: string
      enum: [new, under_review, planned, linked, resolved, dismissed, closed]
    AbuseState:
      type: string
      enum: [new, investigating, escalated, resolved, dismissed]
    ContentState:
      type: string
      enum: [draft, published, retired]
    TemplateState:
      type: string
      enum: [draft, active, retired]
    CampaignState:
      type: string
      enum: [draft, scheduled, sending, paused, completed, cancelled, failed]
    DeliveryState:
      type: string
      enum: [queued, attempted, delivered, opened, failed, excluded]
    Pagination:
      type: object
      additionalProperties: false
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
