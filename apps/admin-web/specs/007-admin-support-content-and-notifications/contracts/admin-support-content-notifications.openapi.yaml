          maxLength: 48
    DeliveryLogPage:
      type: object
      additionalProperties: false
      required: [items, pagination, region]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryLogRecord"
        pagination:
          $ref: "#/components/schemas/Pagination"
        region:
          $ref: "#/components/schemas/RegionState"
    ApiError:
      type: object
      additionalProperties: false
      required: [status, code, message]
      properties:
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          maxLength: 80
        message:
          type: string
          maxLength: 240
        fieldErrors:
          type: object
          maxProperties: 30
          additionalProperties:
            type: array
            maxItems: 10
            items:
              type: string
              maxLength: 160
        correlationId:
          type: string
          maxLength: 48
