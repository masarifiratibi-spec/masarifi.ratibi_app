          maxItems: 30
          items:
            $ref: "#/components/schemas/Metric"
        region:
          $ref: "#/components/schemas/RegionState"
    AudiencePreviewRequest:
      type: object
      additionalProperties: false
      required: [platform, locales, plans, activity]
      properties:
        platform:
          $ref: "#/components/schemas/Platform"
        locales:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Locale"
        plans:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [free, basic, premium]
        activity:
          type: string
          enum: [all, active, inactive]
    AudienceSummary:
      type: object
      additionalProperties: false
      required: [previewId, version, targetedUnique, eligible, excluded, optedOut, invalidTokens, ios, android, multiPlatform, unknown]
      properties:
        previewId:
          type: string
          pattern: "^AUP-[A-Z0-9-]{1,44}$"
        version:
          type: integer
          minimum: 1
        targetedUnique:
          type: integer
          minimum: 0
        eligible:
          type: integer
          minimum: 0
        excluded:
          type: integer
          minimum: 0
        optedOut:
          type: integer
          minimum: 0
        invalidTokens:
          type: integer
          minimum: 0
        ios:
          type: integer
          minimum: 0
        android:
          type: integer
          minimum: 0
        multiPlatform:
          type: integer
          minimum: 0
        unknown:
          type: integer
          minimum: 0
    Campaign:
      type: object
      additionalProperties: false
      required: [id, name, channel, templateId, templateRevision, platforms, locales, audience, scheduleMode, status, metrics, auditReference, updatedAt, revision, actions]
      properties:
        id:
          $ref: "#/components/schemas/CampaignId"
        name:
          type: string
          maxLength: 120
        channel:
          $ref: "#/components/schemas/Channel"
        templateId:
          $ref: "#/components/schemas/TemplateId"
        templateRevision:
          type: integer
          minimum: 1
        platforms:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [ios, android, shared]
        locales:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Locale"
        audience:
          $ref: "#/components/schemas/AudienceSummary"
        scheduleMode:
          type: string
          enum: [send_now, scheduled]
        scheduledAt:
          $ref: "#/components/schemas/Timestamp"
        status:
          $ref: "#/components/schemas/CampaignState"
        metrics:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Metric"
        auditReference:
          type: string
          pattern: "^AUD-[A-Z0-9-]{1,44}$"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        revision:
          type: integer
          minimum: 1
        actions:
          type: array
          items:
            type: string
            enum: [schedule, send_now, pause, resume, cancel]
    CampaignPage:
      type: object
      additionalProperties: false
      required: [items, pagination, region]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Campaign"
        pagination:
          $ref: "#/components/schemas/Pagination"
        region:
          $ref: "#/components/schemas/RegionState"
    CampaignDraftRequest:
      type: object
      additionalProperties: false
      required: [name, channel, templateId, templateRevision, platforms, locales, audiencePreviewId, audienceVersion, scheduleMode]
      properties:
        name:
          type: string
          maxLength: 120
        channel:
          $ref: "#/components/schemas/Channel"
        templateId:
          $ref: "#/components/schemas/TemplateId"
        templateRevision:
          type: integer
          minimum: 1
        platforms:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [ios, android, shared]
        locales:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Locale"
        audiencePreviewId:
          type: string
          pattern: "^AUP-[A-Z0-9-]{1,44}$"
        audienceVersion:
          type: integer
          minimum: 1
        scheduleMode:
          type: string
          enum: [send_now, scheduled]
        scheduledAt:
          $ref: "#/components/schemas/Timestamp"
      allOf:
        - if:
            properties:
              scheduleMode:
                const: scheduled
          then:
            required: [scheduledAt]
    CampaignActionRequest:
      type: object
      additionalProperties: false
      required: [context, action, audiencePreviewId, audienceVersion, templateRevision]
      properties:
        context:
          $ref: "#/components/schemas/ActionContext"
        action:
          type: string
          enum: [schedule, send_now, pause, resume, cancel]
        audiencePreviewId:
          type: string
          pattern: "^AUP-[A-Z0-9-]{1,44}$"
        audienceVersion:
          type: integer
          minimum: 1
        templateRevision:
          type: integer
          minimum: 1
        scheduledAt:
          $ref: "#/components/schemas/Timestamp"
      allOf:
        - if:
            properties:
              action:
                const: schedule
          then:
            required: [scheduledAt]
    DeliveryLogRecord:
      type: object
      additionalProperties: false
      required: [id, maskedUserRef, channel, templateId, platform, status]
      properties:
        id:
