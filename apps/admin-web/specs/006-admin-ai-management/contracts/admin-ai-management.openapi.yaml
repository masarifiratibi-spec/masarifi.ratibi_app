openapi: 3.1.0
info:
  title: Masarifi Admin AI Management Mock Contract
  version: 0.1.0
  description: |
    Proposed frontend-only Phase 5 contract. It is replaceable by the future
    NestJS API and performs no real provider, model, prompt, routing, safety,
    queue, customer-content, or credential operation. All protected content is
    structurally excluded. Every operation may return SafeError.
servers:
  - url: /
tags:
  - name: AI Overview
  - name: Providers and Models
  - name: Prompts
  - name: Usage and Failures
  - name: Reports and Safety

paths:
  /api/v1/admin/ai/overview:
    get:
      tags: [AI Overview]
      operationId: getAiOverview
      parameters:
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/Feature'
        - $ref: '#/components/parameters/ProviderIdQuery'
        - $ref: '#/components/parameters/ModelIdQuery'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Permission-projected AI operational overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiOverview'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/ai/providers:
    get:
      tags: [Providers and Models]
      operationId: listAiProviders
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Feature'
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Paginated provider summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProvidersPage'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/ai/providers/{providerId}:
    get:
      tags: [Providers and Models]
      operationId: getAiProvider
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Permission-projected provider detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProviderDetail'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/ai/providers/{providerId}/actions:
    post:
      tags: [Providers and Models]
      operationId: actOnAiProvider
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/Scenario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/AiAction'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/ai/models:
    get:
      tags: [Providers and Models]
      operationId: listAiModels
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Feature'
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/ProviderIdQuery'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Paginated model summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiModelsPage'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/ai/models/{modelId}/actions:
    post:
      tags: [Providers and Models]
      operationId: actOnAiModel
      parameters:
        - $ref: '#/components/parameters/ModelId'
        - $ref: '#/components/parameters/Scenario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/AiAction'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/ai/prompts:
    get:
      tags: [Prompts]
      operationId: listAiPrompts
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Feature'
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Paginated prompt-version summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiPromptsPage'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/ai/prompts/{promptId}:
    get:
      tags: [Prompts]
      operationId: getAiPrompt
      parameters:
        - $ref: '#/components/parameters/PromptId'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Sanitized fictional prompt-version detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiPromptDetail'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/ai/prompts/{promptId}/actions:
    post:
      tags: [Prompts]
      operationId: actOnAiPrompt
      parameters:
        - $ref: '#/components/parameters/PromptId'
        - $ref: '#/components/parameters/Scenario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/AiAction'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/ai/usage:
    get:
      tags: [Usage and Failures]
      operationId: listAiUsage
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Feature'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/ProviderIdQuery'
        - $ref: '#/components/parameters/ModelIdQuery'
        - $ref: '#/components/parameters/Plan'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Paginated AI usage metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiUsagePage'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/ai/failures:
    get:
      tags: [Usage and Failures]
      operationId: listAiFailures
      parameters:
        - $ref: '#/components/parameters/Feature'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/ProviderIdQuery'
        - $ref: '#/components/parameters/ModelIdQuery'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Paginated AI failure metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiFailuresPage'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/ai/failures/{failureId}/actions:
    post:
      tags: [Usage and Failures]
      operationId: actOnAiFailure
      parameters:
        - $ref: '#/components/parameters/FailureId'
        - $ref: '#/components/parameters/Scenario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailureActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/AiAction'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/ai/reports:
    get:
      tags: [Reports and Safety]
      operationId: listAiResponseReports
      parameters:
        - $ref: '#/components/parameters/Feature'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Severity'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Paginated permission-projected response reports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReportsPage'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/ai/reports/{reportId}/actions:
    post:
      tags: [Reports and Safety]
      operationId: actOnAiResponseReport
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/Scenario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/AiAction'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/ai/safety-rules:
    get:
      tags: [Reports and Safety]
      operationId: listAiSafetyRules
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Feature'
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Severity'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Paginated safety-rule summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSafetyRulesPage'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/ai/safety-rules/{ruleId}/actions:
    post:
      tags: [Reports and Safety]
      operationId: actOnAiSafetyRule
      parameters:
        - $ref: '#/components/parameters/SafetyRuleId'
        - $ref: '#/components/parameters/Scenario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SafetyRuleActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/AiAction'
        default:
          $ref: '#/components/responses/SafeError'

components:
  parameters:
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 120
    Period:
      name: period
      in: query
      schema:
        type: string
        enum: [7d, 30d, 90d]
        default: 30d
    Platform:
      name: platform
      in: query
      schema:
        $ref: '#/components/schemas/PlatformScope'
    Feature:
      name: feature
      in: query
      schema:
        $ref: '#/components/schemas/AiFeature'
    Locale:
      name: locale
      in: query
      schema:
        $ref: '#/components/schemas/LocaleScope'
    Plan:
      name: plan
      in: query
      schema:
        type: string
        enum: [free, basic, premium]
    Status:
      name: status
      in: query
      schema:
        type: string
        maxLength: 40
    Severity:
      name: severity
      in: query
      schema:
        $ref: '#/components/schemas/Severity'
    DateFrom:
      name: dateFrom
      in: query
      schema:
        type: string
        format: date
    DateTo:
      name: dateTo
      in: query
      schema:
        type: string
        format: date
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        enum: [25, 50, 100]
        default: 25
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [name, status, updatedAt, severity, cost, latency, feature, provider, model, time]
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
    Scenario:
      name: __scenario
      in: query
      schema:
        type: string
        enum:
          - success
          - loading
          - slow
          - large
          - empty
          - partial
          - unauthorized
          - forbidden
          - not-found
          - expired
          - validation
          - conflict
          - rate-limited
          - unavailable
          - unsafe-response
          - masking-violation
          - duplicate-pending
          - internal-error
    ProviderId:
      name: providerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ProviderId'
    ProviderIdQuery:
      name: providerId
      in: query
      schema:
        $ref: '#/components/schemas/ProviderId'
    ModelId:
      name: modelId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ModelId'
    ModelIdQuery:
      name: modelId
      in: query
      schema:
        $ref: '#/components/schemas/ModelId'
    PromptId:
      name: promptId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PromptId'
    FailureId:
      name: failureId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/FailureId'
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ReportId'
    SafetyRuleId:
      name: ruleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SafetyRuleId'

  responses:
    SafeError:
      description: Safe validation, permission, conflict, rate-limit, unavailable, or internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AiAction:
      description: Simulated action result
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AiActionResult'

  schemas:
    ProviderId:
      type: string
      maxLength: 48
      pattern: '^AIP-[A-Za-z0-9-]{1,44}$'
    ModelId:
      type: string
      maxLength: 48
      pattern: '^AIM-[A-Za-z0-9-]{1,44}$'
    PromptId:
      type: string
      maxLength: 48
      pattern: '^AIPR-[A-Za-z0-9-]{1,43}$'
    UsageId:
      type: string
      maxLength: 48
      pattern: '^AIU-[A-Za-z0-9-]{1,44}$'
    FailureId:
      type: string
      maxLength: 48
      pattern: '^AIF-[A-Za-z0-9-]{1,44}$'
    ReportId:
      type: string
      maxLength: 48
      pattern: '^AIR-[A-Za-z0-9-]{1,44}$'
    SafetyRuleId:
      type: string
      maxLength: 48
      pattern: '^AIS-[A-Za-z0-9-]{1,44}$'
    PlatformScope:
      type: string
      enum: [all, ios, android, unknown]
      default: all
    LocaleScope:
      type: string
      enum: [ar, en]
    AiFeature:
      type: string
      enum:
        - receipt_analysis
        - screenshot_analysis
        - voice_parsing
        - categorization
        - financial_assistant
        - spending_insights
        - budget_suggestions
        - behavior_analysis
        - report_explanation
    AccessLevel:
      type: string
      enum: [full, aggregate, context]
    Severity:
      type: string
      enum: [info, low, medium, high, critical]
    Timestamp:
      type: string
      format: date-time
    RegionState:
      type: object
      additionalProperties: false
      required: [availability]
      properties:
        availability:
          type: string
          enum: [available, empty, stale, partial, unavailable, forbidden]
        message:
          type: string
          maxLength: 240
        retryable:
          type: boolean
    Pagination:
      type: object
      additionalProperties: false
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
          maximum: 100
        pageSize:
          type: integer
          enum: [25, 50, 100]
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    MoneyEstimate:
      type: object
      additionalProperties: false
      required: [amount, currency, estimated, freshness]
      properties:
        amount:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        estimated:
          const: true
        freshness:
          $ref: '#/components/schemas/Timestamp'
        normalizedAmount:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$'
        normalizedCurrency:
          type: string
          pattern: '^[A-Z]{3}$'
        conversionTimestamp:
          $ref: '#/components/schemas/Timestamp'
    AuditReference:
      type: object
      additionalProperties: false
      required: [eventId, eventName, timestamp]
      properties:
        eventId:
          type: string
          pattern: '^AIA-[A-Za-z0-9-]{1,44}$'
          maxLength: 48
        eventName:
          type: string
          maxLength: 120
        timestamp:
          $ref: '#/components/schemas/Timestamp'
    SafeMetric:
      type: object
      additionalProperties: false
      required: [key, label, value, unit, platform, denominator, freshness]
      properties:
        key:
          type: string
          maxLength: 80
        label:
          type: string
          maxLength: 120
        value:
          type: number
          minimum: 0
        unit:
          type: string
          enum: [requests, attempts, failures, reports, percent, duration_ms, input_units, output_units, customers, estimated_cost]
        platform:
          $ref: '#/components/schemas/PlatformScope'
        denominator:
          type: string
          enum: [original_requests, attempts, failures, reports, customers]
        freshness:
          $ref: '#/components/schemas/Timestamp'
        cost:
          $ref: '#/components/schemas/MoneyEstimate'
    ChartPoint:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label:
          type: string
          maxLength: 120
        value:
          type: number
          minimum: 0
        platform:
          $ref: '#/components/schemas/PlatformScope'
        feature:
          $ref: '#/components/schemas/AiFeature'
    AiOverview:
      type: object
      additionalProperties: false
      required: [platform, period, metrics, featureDistribution, requestTrend, costByCurrency, regions, accessLevel, freshness]
      properties:
        platform:
          $ref: '#/components/schemas/PlatformScope'
        period:
          type: string
          enum: [7d, 30d, 90d]
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/SafeMetric'
          maxItems: 20
        featureDistribution:
          type: array
          items:
            $ref: '#/components/schemas/ChartPoint'
          maxItems: 50
        requestTrend:
          type: array
          items:
            $ref: '#/components/schemas/ChartPoint'
          maxItems: 100
        costByCurrency:
          type: array
          items:
            $ref: '#/components/schemas/MoneyEstimate'
          maxItems: 10
        regions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RegionState'
          maxProperties: 12
        accessLevel:
          $ref: '#/components/schemas/AccessLevel'
        freshness:
          $ref: '#/components/schemas/Timestamp'
    FallbackRoute:
      type: object
      additionalProperties: false
      required: [feature, locale, priority, providerId, modelId, status, compatible, terminalEligible]
      properties:
        feature:
          $ref: '#/components/schemas/AiFeature'
        locale:
          $ref: '#/components/schemas/LocaleScope'
        priority:
          type: integer
          minimum: 1
          maximum: 20
        providerId:
          $ref: '#/components/schemas/ProviderId'
        modelId:
          $ref: '#/components/schemas/ModelId'
        status:
          type: string
          enum: [enabled, disabled]
        compatible:
          type: boolean
        terminalEligible:
          type: boolean
    AiProviderSummary:
      type: object
      additionalProperties: false
      required: [id, name, health, defaultModelId, features, locales, averageLatencyMs, failureRate, estimatedCost, fallbackPriorities, rateLimitState, freshness, revision, accessLevel, actions]
      properties:
        id:
          $ref: '#/components/schemas/ProviderId'
        name:
          type: string
          maxLength: 120
        health:
          type: string
          enum: [healthy, degraded, partial_outage, unavailable]
          description: Authoritative contract value
        defaultModelId:
          $ref: '#/components/schemas/ModelId'
        features:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AiFeature'
        locales:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/LocaleScope'
        averageLatencyMs:
          type: integer
          minimum: 0
        failureRate:
          type: number
          minimum: 0
          maximum: 1
        estimatedCost:
          $ref: '#/components/schemas/MoneyEstimate'
        fallbackPriorities:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 20
          maxItems: 20
        rateLimitState:
          type: string
          enum: [normal, nearing_limit, limited, unavailable]
        freshness:
          $ref: '#/components/schemas/Timestamp'
        revision:
          type: integer
          minimum: 1
        accessLevel:
          $ref: '#/components/schemas/AccessLevel'
        actions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [update_fallback, activate, deactivate]
    AiProviderDetail:
      type: object
      additionalProperties: false
      required: [summary, models, fallbackRoutes, healthTrend, errorTrend, costTrend, regions]
      properties:
        summary:
          $ref: '#/components/schemas/AiProviderSummary'
        models:
          type: array
          items:
            $ref: '#/components/schemas/AiModelSummary'
          maxItems: 100
        fallbackRoutes:
          type: array
          items:
            $ref: '#/components/schemas/FallbackRoute'
          maxItems: 180
        healthTrend:
          type: array
          items:
            $ref: '#/components/schemas/ChartPoint'
          maxItems: 100
        errorTrend:
          type: array
          items:
            $ref: '#/components/schemas/ChartPoint'
          maxItems: 100
        costTrend:
          type: array
          items:
            $ref: '#/components/schemas/ChartPoint'
          maxItems: 100
        regions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RegionState'
          maxProperties: 8
    AiModelSummary:
      type: object
      additionalProperties: false
      required: [id, name, providerId, features, locales, assignments, inputLimit, inputCost, outputCost, status, version, eligible, revision, actions]
      properties:
        id:
          $ref: '#/components/schemas/ModelId'
        name:
          type: string
          maxLength: 120
        providerId:
          $ref: '#/components/schemas/ProviderId'
        features:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AiFeature'
        locales:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/LocaleScope'
        assignments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [feature, locale, primary]
            properties:
              feature:
                $ref: '#/components/schemas/AiFeature'
              locale:
                $ref: '#/components/schemas/LocaleScope'
              primary:
                type: boolean
          maxItems: 18
        inputLimit:
          type: integer
          minimum: 1
        inputCost:
          $ref: '#/components/schemas/MoneyEstimate'
        outputCost:
          $ref: '#/components/schemas/MoneyEstimate'
        status:
          type: string
          enum: [active, limited, inactive, unavailable]
