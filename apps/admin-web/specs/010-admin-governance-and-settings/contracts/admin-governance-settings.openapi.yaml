openapi: 3.1.0
info:
  title: Masarifi Admin Governance and Settings Mock Contract
  version: 0.1.0
  description: >-
    Frontend-only proposed contracts for Spec 010. All records and mutations are
    deterministic fictional mock behavior. These paths do not implement or
    authorize a production backend.
servers:
  - url: /api/v1/admin
tags:
  - name: Admin Team
  - name: Roles
  - name: Settings
  - name: Foundation Integration

paths:
  /admin-users:
    get:
      tags: [Admin Team]
      operationId: listAdminUsers
      summary: List safe Admin summaries
      x-permission: admin-team.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema:
            oneOf:
              - $ref: '#/components/schemas/AdminStatus'
              - const: all
        - name: roleId
          in: query
          schema: { $ref: '#/components/schemas/RoleId' }
        - name: department
          in: query
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: twoFactorState
          in: query
          schema:
            type: string
            enum: [all, required_enabled, optional_enabled, missing]
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, status, last_login, created_at]
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: Role-shaped Admin page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUsersPage' }
        default: { $ref: '#/components/responses/SafeError' }

  /admin-users/{adminId}:
    get:
      tags: [Admin Team]
      operationId: getAdminUser
      summary: Read a structurally projected Admin profile
      x-permission: admin-team.read
      parameters:
        - $ref: '#/components/parameters/AdminId'
      responses:
        '200':
          description: Super Admin or Security Administrator projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserDetail' }
        default: { $ref: '#/components/responses/SafeError' }

  /admin-invitations:
    get:
      tags: [Admin Team]
      operationId: listAdminInvitations
      summary: List masked fictional invitation scenarios
      description: Requires both admin-team.read and admin-team.invite.
      x-permissions: [admin-team.read, admin-team.invite]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            oneOf:
              - $ref: '#/components/schemas/InvitationStatus'
              - const: all
      responses:
        '200':
          description: Masked invitation page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminInvitationsPage' }
        default: { $ref: '#/components/responses/SafeError' }
    post:
      tags: [Admin Team]
      operationId: inviteAdmin
      summary: Create one Pending fictional invitation
      x-permission: admin-team.invite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteAdminRequest' }
      responses:
        '201':
          description: Pending invitation; response email remains masked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminInvitationResult' }
        default: { $ref: '#/components/responses/SafeError' }

  /admin-users/{adminId}/disable:
    post:
      tags: [Admin Team]
      operationId: disableAdmin
      summary: Disable an eligible fictional Admin
      x-permission: admin-team.disable
      parameters:
        - $ref: '#/components/parameters/AdminId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisableAdminRequest' }
      responses:
        '200':
          description: Updated safe Admin result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserMutationResult' }
        default: { $ref: '#/components/responses/SafeError' }

  /admin-users/{adminId}/sessions/revoke:
    post:
      tags: [Admin Team]
      operationId: revokeAdminSessions
      summary: Revoke eligible fictional Admin sessions
      x-permission: admin-team.sessions.revoke
      parameters:
        - $ref: '#/components/parameters/AdminId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeAdminSessionsRequest' }
      responses:
        '200':
          description: Updated safe Admin result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserMutationResult' }
        default: { $ref: '#/components/responses/SafeError' }

  /admin-users/{adminId}/roles:
    put:
      tags: [Admin Team]
      operationId: assignAdminRoles
      summary: Replace an eligible fictional Admin role assignment set
      x-permission: admin-team.roles.assign
      parameters:
        - $ref: '#/components/parameters/AdminId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignAdminRolesRequest' }
      responses:
        '200':
          description: Updated safe Admin result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserMutationResult' }
        default: { $ref: '#/components/responses/SafeError' }

  /roles:
    get:
      tags: [Roles]
      operationId: listRoles
      summary: List system and custom governance roles
      x-permission: roles.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: kind
          in: query
          schema: { type: string, enum: [all, system, custom] }
        - name: status
          in: query
          schema: { type: string, enum: [all, active, disabled] }
      responses:
        '200':
          description: Role page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolesPage' }
        default: { $ref: '#/components/responses/SafeError' }
    post:
      tags: [Roles]
      operationId: createRole
      summary: Create one Active fictional custom role
      x-permissions: [roles.manage, permissions.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201':
          description: Created custom role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleMutationResult' }
        default: { $ref: '#/components/responses/SafeError' }

  /roles/{roleId}:
    get:
      tags: [Roles]
      operationId: getRole
      summary: Read role detail and assignments
      x-permission: roles.read
      parameters:
        - $ref: '#/components/parameters/RoleId'
      responses:
        '200':
          description: Role detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleDetail' }
        default: { $ref: '#/components/responses/SafeError' }
    put:
      tags: [Roles]
      operationId: updateRole
      summary: Edit or enable/disable an eligible custom role
      x-permissions: [roles.manage, permissions.manage]
      parameters:
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
      responses:
        '200':
          description: Updated custom role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleMutationResult' }
        default: { $ref: '#/components/responses/SafeError' }

  /permissions:
    get:
      tags: [Roles]
      operationId: getPermissionMatrix
      summary: Read the complete permission matrix
      description: permissions.read is required; assignment cells also require roles.read.
      x-permissions: [permissions.read, roles.read]
      parameters:
        - name: group
          in: query
          schema:
            oneOf:
              - $ref: '#/components/schemas/PermissionGroup'
              - const: all
        - name: action
          in: query
          schema:
            oneOf:
              - $ref: '#/components/schemas/PermissionAction'
              - const: all
        - name: roleId
          in: query
          schema: { $ref: '#/components/schemas/RoleId' }
        - name: assigned
          in: query
          schema: { type: string, enum: [all, assigned, unassigned] }
      responses:
        '200':
          description: Complete grouped matrix
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionMatrixResponse' }
        default: { $ref: '#/components/responses/SafeError' }

  /settings/{group}:
    parameters:
      - $ref: '#/components/parameters/SettingsGroup'
    get:
      tags: [Settings]
      operationId: getSettingsGroup
      summary: Read one typed settings group
      description: Requires the exact settings.{group}.read permission.
      x-permission-template: settings.{group}.read
      responses:
        '200':
          description: Typed settings group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsGroupDetail' }
        default: { $ref: '#/components/responses/SafeError' }
    put:
      tags: [Settings]
      operationId: updateSettingsGroup
      summary: Atomically update changed fields in one settings group
      description: Requires the exact settings.{group}.manage permission.
      x-permission-template: settings.{group}.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSettingsGroupRequest' }
      responses:
        '200':
          description: Updated typed settings group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsMutationResult' }
        default: { $ref: '#/components/responses/SafeError' }

  /feature-flags:
    get:
      tags: [Settings]
      operationId: listFeatureFlags
      summary: List fictional feature flags
      x-permission: settings.flags.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: platform
          in: query
          schema: { type: string, enum: [all, ios, android, shared] }
        - name: audience
          in: query
          schema:
            oneOf:
              - $ref: '#/components/schemas/FeatureFlagAudience'
              - const: all
        - name: status
          in: query
          schema:
            oneOf:
              - $ref: '#/components/schemas/FeatureFlagStatus'
              - const: all
      responses:
        '200':
          description: Feature flag page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureFlagsPage' }
        default: { $ref: '#/components/responses/SafeError' }

  /feature-flags/{flagId}:
    put:
      tags: [Settings]
      operationId: updateFeatureFlag
      summary: Update one eligible fictional feature flag
      x-permission: settings.flags.manage
      parameters:
        - $ref: '#/components/parameters/FlagId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFeatureFlagRequest' }
      responses:
        '200':
          description: Updated feature flag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureFlagMutationResult' }
        default: { $ref: '#/components/responses/SafeError' }

  /maintenance:
    get:
      tags: [Settings]
      operationId: getMaintenance
      summary: Read simulated maintenance state
      x-permission: settings.maintenance.read
      responses:
        '200':
          description: Current mock maintenance state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceState' }
        default: { $ref: '#/components/responses/SafeError' }
    put:
      tags: [Settings]
      operationId: updateMaintenance
      summary: Schedule, activate, reschedule, cancel, or end simulated maintenance
      x-permission: settings.maintenance.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMaintenanceRequest' }
      responses:
        '200':
          description: Updated mock maintenance state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceMutationResult' }
        default: { $ref: '#/components/responses/SafeError' }

  /search:
    get:
      tags: [Foundation Integration]
      operationId: globalSearch
      summary: Search safe authorized summaries across the completed Admin product
      x-permission: global-search.use
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
        - name: entityTypes
          in: query
          schema:
            type: array
            uniqueItems: true
            items: { $ref: '#/components/schemas/SearchEntity' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Permission-filtered grouped search response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GlobalSearchResponse' }
        default: { $ref: '#/components/responses/SafeError' }

  /attention:
    get:
      tags: [Foundation Integration]
      operationId: listAttention
      summary: List permission-filtered operational attention
      x-permission: attention.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: severity
          in: query
          schema:
            type: string
            enum: [all, critical, high, medium, low, info]
        - name: platform
          in: query
          schema:
            type: string
            enum: [all, global, ios, android, unknown]
      responses:
        '200':
          description: Permission-filtered attention response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttentionResponse' }
        default: { $ref: '#/components/responses/SafeError' }

components:
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, enum: [25, 50, 100], default: 25 }
    Search:
      name: search
      in: query
      schema: { type: string, minLength: 2, maxLength: 120 }
    AdminId:
      name: adminId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/AdminId' }
    RoleId:
      name: roleId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/RoleId' }
    FlagId:
      name: flagId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/FlagId' }
    SettingsGroup:
      name: group
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SettingsGroupKey' }

  responses:
    SafeError:
      description: Safe 400/401/403/404/409/429/500/503 response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GovernanceApiError' }

  schemas:
    AdminId:
      type: string
      pattern: '^ADM-[A-Z0-9-]{3,64}$'
    InvitationId:
      type: string
      pattern: '^INV-[A-Z0-9-]{3,64}$'
    RoleId:
      type: string
      pattern: '^ROLE-[A-Z0-9-]{3,64}$'
    SessionId:
      type: string
      pattern: '^ASES-[A-Z0-9-]{3,64}$'
    FlagId:
      type: string
      pattern: '^FLAG-[A-Z0-9-]{3,64}$'
    SubmissionKey:
      type: string
      pattern: '^[A-Za-z0-9._~-]{16,128}$'
    Version:
      type: integer
      minimum: 1
    Timestamp:
      type: string
      format: date-time
    SafeReason:
      type: string
      minLength: 10
      maxLength: 500
    LocalizedText:
      type: object
      additionalProperties: false
      required: [ar, en]
      properties:
        ar: { type: string, minLength: 2, maxLength: 500 }
        en: { type: string, minLength: 2, maxLength: 500 }
    AuditReference:
      type: object
      additionalProperties: false
      required: [id, kind, label]
      properties:
        id: { type: string, pattern: '^AUD-[A-Z0-9-]{3,80}$' }
        kind: { const: audit }
        label: { type: string, minLength: 1, maxLength: 120 }
    PageMeta:
      type: object
      additionalProperties: false
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, enum: [25, 50, 100] }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    AdminStatus:
      type: string
      enum: [invited, active, disabled]
    AdminRoleReference:
      type: object
      additionalProperties: false
      required: [id, key, label, kind, status]
      properties:
        id: { $ref: '#/components/schemas/RoleId' }
        key: { type: string, minLength: 3, maxLength: 64 }
        label: { type: string, minLength: 2, maxLength: 80 }
        kind: { type: string, enum: [system, custom] }
        status: { type: string, enum: [active, disabled] }
    AdminUserSummary:
      type: object
      additionalProperties: false
      required: [id, displayName, maskedEmail, roleSummaries, department, status, twoFactorState, lastLoginAt, activeSessionCount, createdAt, version, allowedActions]
      properties:
        id: { $ref: '#/components/schemas/AdminId' }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        maskedEmail: { type: string, minLength: 3, maxLength: 254 }
        roleSummaries:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/AdminRoleReference' }
        department: { type: string, minLength: 1, maxLength: 80 }
        status: { $ref: '#/components/schemas/AdminStatus' }
        twoFactorState: { type: string, enum: [required_enabled, optional_enabled, missing] }
        lastLoginAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        activeSessionCount: { type: integer, minimum: 0 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        version: { $ref: '#/components/schemas/Version' }
        allowedActions:
          type: array
          uniqueItems: true
          items: { type: string, enum: [assign_roles, revoke_sessions, disable] }
    AdminSessionSummary:
      type: object
      additionalProperties: false
      required: [id, deviceLabel, broadRegion, startedAt, lastActivityAt, isCurrentSession, riskLabel, state]
      properties:
        id: { $ref: '#/components/schemas/SessionId' }
        deviceLabel: { type: string, minLength: 1, maxLength: 80 }
        broadRegion: { type: string, minLength: 2, maxLength: 80 }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        lastActivityAt: { $ref: '#/components/schemas/Timestamp' }
        isCurrentSession: { type: boolean }
        riskLabel: { type: string, enum: [low, medium, high] }
        state: { type: string, enum: [active, revoked, expired] }
    AdminUserDetail:
      allOf:
        - $ref: '#/components/schemas/AdminUserSummary'
        - type: object
          additionalProperties: false
          required: [effectivePermissionGroups, assignedTicketCount, recentActions, sessions, securityState, auditReferences, access]
          properties:
            effectivePermissionGroups:
              type: array
              uniqueItems: true
              items: { $ref: '#/components/schemas/PermissionGroup' }
            assignedTicketCount: { type: integer, minimum: 0 }
            recentActions:
              type: array
              maxItems: 25
              items: { type: string, minLength: 1, maxLength: 160 }
            sessions:
              type: array
              maxItems: 25
              items: { $ref: '#/components/schemas/AdminSessionSummary' }
            securityState: { type: string, enum: [healthy, warning, high_risk] }
            auditReferences:
              type: array
              maxItems: 25
              items: { $ref: '#/components/schemas/AuditReference' }
            access: { type: string, enum: [full, security_read_only] }
    AdminUsersPage:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminUserSummary' } }
        pagination: { $ref: '#/components/schemas/PageMeta' }
    InvitationStatus:
      type: string
      enum: [pending, accepted, expired, revoked]
    AdminInvitationSummary:
      type: object
      additionalProperties: false
      required: [id, maskedEmail, name, role, department, createdAt, expiresAt, status, version, auditReference]
      properties:
        id: { $ref: '#/components/schemas/InvitationId' }
        maskedEmail: { type: string, minLength: 3, maxLength: 254 }
        name: { type: string, minLength: 1, maxLength: 120 }
        role: { $ref: '#/components/schemas/AdminRoleReference' }
        department: { type: string, minLength: 1, maxLength: 80 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        status: { $ref: '#/components/schemas/InvitationStatus' }
        version: { $ref: '#/components/schemas/Version' }
        auditReference: { $ref: '#/components/schemas/AuditReference' }
    AdminInvitationsPage:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminInvitationSummary' } }
        pagination: { $ref: '#/components/schemas/PageMeta' }
    InviteAdminRequest:
      type: object
      additionalProperties: false
      required: [email, name, roleId, department, expiryDays, submissionKey]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        name: { type: string, minLength: 1, maxLength: 120 }
        roleId: { $ref: '#/components/schemas/RoleId' }
        department: { type: string, minLength: 1, maxLength: 80 }
        expiryDays: { type: integer, minimum: 1, maximum: 30, default: 7 }
        message: { type: string, maxLength: 1000 }
        submissionKey: { $ref: '#/components/schemas/SubmissionKey' }
    DisableAdminRequest:
      type: object
      additionalProperties: false
      required: [adminId, reason, revokeEligibleSessions, expectedStatus, expectedVersion, submissionKey]
      properties:
        adminId: { $ref: '#/components/schemas/AdminId' }
        reason: { $ref: '#/components/schemas/SafeReason' }
        revokeEligibleSessions: { type: boolean }
        replacementAdminId: { $ref: '#/components/schemas/AdminId' }
        expectedStatus: { const: active }
        expectedVersion: { $ref: '#/components/schemas/Version' }
        submissionKey: { $ref: '#/components/schemas/SubmissionKey' }
    RevokeAdminSessionsRequest:
      type: object
      additionalProperties: false
      required: [adminId, sessionIds, revokeAllEligible, reason, expectedVersion, submissionKey]
      properties:
        adminId: { $ref: '#/components/schemas/AdminId' }
        sessionIds:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/SessionId' }
        revokeAllEligible: { type: boolean }
        reason: { $ref: '#/components/schemas/SafeReason' }
        expectedVersion: { $ref: '#/components/schemas/Version' }
        submissionKey: { $ref: '#/components/schemas/SubmissionKey' }
    AssignAdminRolesRequest:
      type: object
      additionalProperties: false
      required: [adminId, roleIds, reason, expectedVersion, submissionKey]
      properties:
        adminId: { $ref: '#/components/schemas/AdminId' }
        roleIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/RoleId' }
        reason: { $ref: '#/components/schemas/SafeReason' }
        expectedVersion: { $ref: '#/components/schemas/Version' }
        submissionKey: { $ref: '#/components/schemas/SubmissionKey' }
    AdminInvitationResult:
      type: object
      additionalProperties: false
      required: [invitation, auditReference, mockOnly]
      properties:
        invitation: { $ref: '#/components/schemas/AdminInvitationSummary' }
        auditReference: { $ref: '#/components/schemas/AuditReference' }
        mockOnly: { const: true }
    AdminUserMutationResult:
      type: object
      additionalProperties: false
      required: [admin, affectedScope, auditReference, mockOnly]
      properties:
        admin: { $ref: '#/components/schemas/AdminUserDetail' }
        affectedScope: { type: string, minLength: 1, maxLength: 240 }
        auditReference: { $ref: '#/components/schemas/AuditReference' }
        mockOnly: { const: true }
    RoleKind:
      type: string
      enum: [system, custom]
    RoleStatus:
      type: string
      enum: [active, disabled]
    RoleKey:
      type: string
      pattern: '^[a-z][a-z0-9.-]{2,63}$'
    RoleSummary:
      type: object
      additionalProperties: false
      required: [id, key, name, description, assignedAdminCount, permissionCount, kind, status, updatedAt, version, allowedActions]
      properties:
        id: { $ref: '#/components/schemas/RoleId' }
        key: { $ref: '#/components/schemas/RoleKey' }
        name: { $ref: '#/components/schemas/LocalizedText' }
        description: { type: string, maxLength: 500 }
        assignedAdminCount: { type: integer, minimum: 0 }
        permissionCount: { type: integer, minimum: 0 }
        kind: { $ref: '#/components/schemas/RoleKind' }
        status: { $ref: '#/components/schemas/RoleStatus' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        version: { $ref: '#/components/schemas/Version' }
        allowedActions:
          type: array
          uniqueItems: true
          items: { type: string, enum: [edit, enable, disable] }
    RoleDetail:
      allOf:
