        status: { type: integer, enum: [400, 401, 403, 404, 409, 429, 500, 503] }
        code: { type: string, minLength: 2, maxLength: 80 }
        message: { type: string, minLength: 1, maxLength: 240 }
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            maxItems: 5
            items: { type: string, minLength: 1, maxLength: 160 }
        retryable: { type: boolean }
        currentVersion: { type: integer, minimum: 1 }
        correlationId: { type: string, minLength: 3, maxLength: 100 }
