openapi: 3.1.0
info:
  title: Masarifi Admin Imports and Parsers Mock Contract
  version: 0.1.0
  description: |
    Proposed frontend-only Phase 4 contract. It is replaceable by the future
    NestJS API and performs no real import, parsing, transaction, file, bank,
    queue, or deployment operation. Every operation may return the documented
    safe ApiError for validation, forbidden, not-found, gone, conflict,
    rate-limit, unavailable, or internal-error outcomes.
servers:
  - url: /
tags:
  - name: Import Overview and Sessions
  - name: Import Exception Triage
  - name: Parser Coverage and Senders
  - name: Parser Rules Tests and Versions
  - name: Merchant and Category Rules

paths:
  /api/v1/admin/imports/overview:
    get:
      tags: [Import Overview and Sessions]
      operationId: getImportOverview
      parameters:
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Import operational overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportOverview'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/imports/sessions:
    get:
      tags: [Import Overview and Sessions]
      operationId: listImportSessions
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/BankIdQuery'
        - $ref: '#/components/parameters/ParserVersionIdQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Paginated import sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSessionsPage'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/imports/sessions/{importId}:
    get:
      tags: [Import Overview and Sessions]
      operationId: getImportSession
      parameters:
        - $ref: '#/components/parameters/ImportId'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Permission-projected import-session detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSessionDetailProjection'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/imports/sessions/{importId}/retry-handoff:
    post:
      tags: [Import Overview and Sessions]
      operationId: createImportRetryHandoff
      parameters:
        - $ref: '#/components/parameters/ImportId'
        - $ref: '#/components/parameters/Scenario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRetryHandoffRequest'
      responses:
        '200':
          $ref: '#/components/responses/ImportAction'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/imports/failures:
    get:
      tags: [Import Exception Triage]
      operationId: listFailedImports
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/BankIdQuery'
        - $ref: '#/components/parameters/ParserVersionIdQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Paginated failed imports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailedImportsPage'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/imports/failures/{failureId}/action:
    post:
      tags: [Import Exception Triage]
      operationId: actOnFailedImport
      parameters:
        - $ref: '#/components/parameters/FailureId'
        - $ref: '#/components/parameters/Scenario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailedImportActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/ImportAction'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/imports/low-confidence:
    get:
      tags: [Import Exception Triage]
      operationId: listLowConfidenceItems
      parameters:
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Paginated low-confidence items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LowConfidencePage'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/imports/low-confidence/{itemId}/review:
    post:
      tags: [Import Exception Triage]
      operationId: reviewLowConfidenceItem
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/Scenario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfidenceReviewRequest'
      responses:
        '200':
          $ref: '#/components/responses/ImportAction'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/imports/duplicates:
    get:
      tags: [Import Exception Triage]
      operationId: listDuplicateCandidates
      parameters:
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Paginated duplicate candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateCandidatesPage'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/imports/duplicates/{candidateId}/resolve:
    post:
      tags: [Import Exception Triage]
      operationId: resolveDuplicateCandidate
      parameters:
        - $ref: '#/components/parameters/CandidateId'
        - $ref: '#/components/parameters/Scenario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateResolutionRequest'
      responses:
        '200':
          $ref: '#/components/responses/ImportAction'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/imports/unsupported-formats:
    get:
      tags: [Import Exception Triage]
      operationId: listUnsupportedFormats
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Paginated unsupported formats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsupportedFormatsPage'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/imports/unsupported-formats/{formatId}/action:
    post:
      tags: [Import Exception Triage]
      operationId: actOnUnsupportedFormat
      parameters:
        - $ref: '#/components/parameters/FormatId'
        - $ref: '#/components/parameters/Scenario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnsupportedFormatActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/ImportAction'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/parsers/banks:
    get:
      tags: [Parser Coverage and Senders]
      operationId: listSupportedBanks
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Country'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Paginated bank coverage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanksPage'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/parsers/banks/{bankId}:
    get:
      tags: [Parser Coverage and Senders]
      operationId: getBankDetail
      parameters:
        - $ref: '#/components/parameters/BankId'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Permission-projected bank detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankDetailProjection'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/parsers/senders:
    get:
      tags: [Parser Coverage and Senders]
      operationId: listSenders
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/BankIdQuery'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Paginated sender rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendersPage'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/parsers/senders/{senderId}/action:
    post:
      tags: [Parser Coverage and Senders]
      operationId: actOnSender
      parameters:
        - $ref: '#/components/parameters/SenderId'
        - $ref: '#/components/parameters/Scenario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SenderActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/ParserAction'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/parsers/rules:
    get:
      tags: [Parser Rules Tests and Versions]
      operationId: listParserRules
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/BankIdQuery'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Paginated parser rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParserRulesPage'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/parsers/rules/{ruleId}:
    get:
      tags: [Parser Rules Tests and Versions]
      operationId: getParserRule
      parameters:
        - $ref: '#/components/parameters/RuleId'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Parser rule detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParserRuleDetail'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/parsers/rules/{ruleId}/test-preview:
    post:
      tags: [Parser Rules Tests and Versions]
      operationId: previewParserRule
      parameters:
        - $ref: '#/components/parameters/RuleId'
        - $ref: '#/components/parameters/Scenario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParserTestPreviewRequest'
      responses:
        '200':
          description: Deterministic fictional parser preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParserTestPreviewResult'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/parsers/rules/{ruleId}/action:
    post:
      tags: [Parser Rules Tests and Versions]
      operationId: actOnParserRule
      parameters:
        - $ref: '#/components/parameters/RuleId'
        - $ref: '#/components/parameters/Scenario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParserRuleActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/ParserAction'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/parsers/test-cases:
    get:
      tags: [Parser Rules Tests and Versions]
      operationId: listParserTestCases
      parameters:
        - $ref: '#/components/parameters/RuleIdQuery'
        - $ref: '#/components/parameters/ParserVersionIdQuery'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Paginated parser test cases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParserTestCasesPage'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/parsers/versions:
    get:
      tags: [Parser Rules Tests and Versions]
      operationId: listParserVersions
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Paginated parser versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParserVersionsPage'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/parsers/versions/{versionId}/action:
    post:
      tags: [Parser Rules Tests and Versions]
      operationId: actOnParserVersion
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/Scenario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParserVersionActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/ParserAction'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/parsers/merchant-rules:
    get:
      tags: [Merchant and Category Rules]
      operationId: listMerchantRules
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Country'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Paginated merchant rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantRulesPage'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/parsers/merchant-rules/{ruleId}/action:
    post:
      tags: [Merchant and Category Rules]
      operationId: actOnMerchantRule
      parameters:
        - $ref: '#/components/parameters/MerchantRuleId'
        - $ref: '#/components/parameters/Scenario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantRuleActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/ParserAction'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/parsers/category-rules:
    get:
      tags: [Merchant and Category Rules]
      operationId: listCategoryRules
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Scenario'
      responses:
        '200':
          description: Paginated category rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryRulesPage'
        default:
          $ref: '#/components/responses/SafeError'

  /api/v1/admin/parsers/category-rules/{ruleId}/action:
    post:
      tags: [Merchant and Category Rules]
      operationId: actOnCategoryRule
      parameters:
        - $ref: '#/components/parameters/CategoryRuleId'
        - $ref: '#/components/parameters/Scenario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRuleActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/ParserAction'
        default:
          $ref: '#/components/responses/SafeError'

components:
  parameters:
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 120
    Period:
      name: period
      in: query
      schema:
        type: string
        enum: [7d, 30d, 90d]
        default: 30d
    Platform:
      name: platform
      in: query
      schema:
        $ref: '#/components/schemas/PlatformScope'
    Source:
      name: source
      in: query
      schema:
        $ref: '#/components/schemas/ImportSource'
    Status:
      name: status
      in: query
      schema:
        type: string
        maxLength: 48
    Country:
      name: country
      in: query
      schema:
        type: string
        pattern: '^[A-Z]{2}$'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        enum: [25, 50, 100]
        default: 25
    Sort:
      name: sort
      in: query
      schema:
        type: string
        maxLength: 48
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
    Scenario:
      name: __scenario
      in: query
      description: Development-only deterministic mock scenario.
      schema:
        type: string
        maxLength: 48
    BankIdQuery:
      name: bankId
      in: query
      schema:
        $ref: '#/components/schemas/BankId'
    ParserVersionIdQuery:
      name: parserVersionId
      in: query
      schema:
        $ref: '#/components/schemas/VersionId'
    RuleIdQuery:
      name: ruleId
      in: query
      schema:
        $ref: '#/components/schemas/ParserRuleId'
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ImportId'
    FailureId:
      name: failureId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/FailureId'
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ItemId'
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CandidateId'
    FormatId:
      name: formatId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/FormatId'
    BankId:
      name: bankId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/BankId'
    SenderId:
      name: senderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SenderId'
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ParserRuleId'
    MerchantRuleId:
      name: ruleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MerchantRuleId'
    CategoryRuleId:
      name: ruleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CategoryRuleId'
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/VersionId'

  responses:
    SafeError:
      description: Safe validation, forbidden, not-found, gone, conflict, rate-limit, unavailable, or internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ImportAction:
      description: Simulated import action result
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActionResult'
    ParserAction:
      description: Simulated parser or rule action result
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActionResult'

  schemas:
    SafeId:
      type: string
      minLength: 3
      maxLength: 48
      pattern: '^[A-Z][A-Z0-9_-]{2,47}$'
    ImportId:
      allOf:
        - $ref: '#/components/schemas/SafeId'
      pattern: '^IMP-[A-Z0-9_-]{1,44}$'
    FailureId:
      allOf:
        - $ref: '#/components/schemas/SafeId'
      pattern: '^IFL-[A-Z0-9_-]{1,44}$'
    ItemId:
      allOf:
        - $ref: '#/components/schemas/SafeId'
      pattern: '^ITM-[A-Z0-9_-]{1,44}$'
    CandidateId:
      allOf:
        - $ref: '#/components/schemas/SafeId'
      pattern: '^DUP-[A-Z0-9_-]{1,44}$'
    FormatId:
      allOf:
        - $ref: '#/components/schemas/SafeId'
      pattern: '^FMT-[A-Z0-9_-]{1,44}$'
    BankId:
      allOf:
        - $ref: '#/components/schemas/SafeId'
      pattern: '^BNK-[A-Z0-9_-]{1,44}$'
    SenderId:
      allOf:
        - $ref: '#/components/schemas/SafeId'
      pattern: '^SND-[A-Z0-9_-]{1,44}$'
    ParserRuleId:
      allOf:
        - $ref: '#/components/schemas/SafeId'
      pattern: '^PRL-[A-Z0-9_-]{1,44}$'
    MerchantRuleId:
      allOf:
        - $ref: '#/components/schemas/SafeId'
      pattern: '^MR-[A-Z0-9_-]{1,44}$'
    CategoryRuleId:
      allOf:
        - $ref: '#/components/schemas/SafeId'
      pattern: '^CR-[A-Z0-9_-]{1,44}$'
    VersionId:
      allOf:
        - $ref: '#/components/schemas/SafeId'
      pattern: '^PV-[A-Z0-9_-]{1,44}$'
    PlatformScope:
      type: string
      enum: [all, android, ios, unknown]
    ImportSource:
      type: string
      enum:
        - android_sms
        - android_notification
        - ios_shortcut
        - ios_app_intent
        - ios_share_extension
        - screenshot
        - receipt
        - csv
        - pdf_statement
        - voice
        - manual
    AccessLevel:
      type: string
      enum: [full, limited, context]
    PermissionAction:
      type: string
      maxLength: 64
    Timestamp:
      type: string
      format: date-time
    MaskedText:
      type: string
      minLength: 1
      maxLength: 120
    Reason:
      type: string
      minLength: 1
      maxLength: 500
    ConfirmationToken:
      type: string
      minLength: 8
      maxLength: 80
    RegionState:
      type: string
      enum: [ready, empty, partial, unavailable]
    AuditReference:
      type: object
      additionalProperties: false
      required: [id, event, occurredAt]
      properties:
        id:
          $ref: '#/components/schemas/SafeId'
        event:
          type: string
          maxLength: 120
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
    ApiError:
      type: object
      additionalProperties: false
      required: [status, code, message]
      properties:
        status:
          type: integer
          enum: [400, 401, 403, 404, 409, 410, 429, 500, 502, 503]
        code:
          type: string
          enum:
            - validation_error
            - forbidden
            - not_found
            - conflict
            - session_expired
            - gone
            - rate_limited
            - provider_unavailable
            - internal_error
        message:
          type: string
          maxLength: 240
        fieldErrors:
          type: object
          maxProperties: 20
          additionalProperties:
            type: array
            maxItems: 5
            items:
              type: string
              maxLength: 160
        correlationId:
          $ref: '#/components/schemas/SafeId'

    Metric:
      type: object
      additionalProperties: false
      required: [key, label, value, unit, platform, deduplicationState]
      properties:
        key:
          type: string
          maxLength: 80
        label:
          type: string
          maxLength: 120
        value:
          type: number
        unit:
          type: string
