openapi: 3.1.0
info:
  title: Masarifi Admin Security, Audit, and Privacy Mock Contract
  version: 0.1.0
  description: >
    Proposed frontend contract for Phase 7. It defines mock HTTP behavior only;
    no backend, authentication, risk engine, audit infrastructure, archive,
    download, deletion, retention cleanup, storage, queue, or job is implemented.
servers:
  - url: /api/v1/admin

paths:
  /security/overview:
    get:
      operationId: getSecurityOverview
      parameters:
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Scenario"
      responses:
        "200":
          description: Privacy-safe security aggregates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityOverview"
        default:
          $ref: "#/components/responses/SafeError"

  /security/authentication-events:
    get:
      operationId: listAuthenticationEvents
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/SortOrder"
        - $ref: "#/components/parameters/Scenario"
        - name: actorType
          in: query
          schema:
            $ref: "#/components/schemas/ActorType"
        - name: eventType
          in: query
          schema:
            type: string
            maxLength: 64
        - name: risk
          in: query
          schema:
            $ref: "#/components/schemas/RiskLevel"
        - name: result
          in: query
          schema:
            $ref: "#/components/schemas/EventResult"
        - name: region
          in: query
          schema:
            type: string
            maxLength: 64
        - name: sort
          in: query
          schema:
            type: string
            enum: [occurred_at, risk, event_type, result]
      responses:
        "200":
          description: Role-projected authentication event page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationEventPage"
        default:
          $ref: "#/components/responses/SafeError"

  /security/suspicious-activity:
    get:
      operationId: listSuspiciousActivity
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/SortOrder"
        - $ref: "#/components/parameters/Scenario"
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/SuspiciousActivityState"
        - name: risk
          in: query
          schema:
            $ref: "#/components/schemas/RiskLevel"
        - name: reviewerId
          in: query
          schema:
            type: string
            maxLength: 48
        - name: sort
          in: query
          schema:
            type: string
            enum: [updated_at, created_at, risk_score, state]
      responses:
        "200":
          description: Suspicious activity page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuspiciousActivityPage"
        default:
          $ref: "#/components/responses/SafeError"

  /security/suspicious-activity/{activityId}/actions:
    post:
      operationId: actOnSuspiciousActivity
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspiciousActivityActionRequest"
      responses:
        "200":
          description: Updated suspicious activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuspiciousActivityDetail"
        default:
          $ref: "#/components/responses/SafeError"

  /security/admins:
    get:
      operationId: listAdminSecurity
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Scenario"
        - name: risk
          in: query
          schema:
            $ref: "#/components/schemas/RiskLevel"
        - name: twoFactorState
          in: query
          schema:
            $ref: "#/components/schemas/TwoFactorState"
        - name: role
          in: query
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Admin security posture page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSecurityPage"
        default:
          $ref: "#/components/responses/SafeError"

  /security/permission-changes:
    get:
      operationId: listPermissionChanges
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/SortOrder"
        - $ref: "#/components/parameters/Scenario"
        - name: result
          in: query
          schema:
            $ref: "#/components/schemas/EventResult"
        - name: sort
          in: query
          schema:
            type: string
            enum: [changed_at, subject, result]
      responses:
        "200":
          description: Immutable permission change page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionChangePage"
        default:
          $ref: "#/components/responses/SafeError"

  /security/support-access:
    get:
      operationId: listSupportAccess
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Scenario"
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/SupportAccessState"
      responses:
        "200":
          description: Role-projected support access page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccessPage"
        default:
          $ref: "#/components/responses/SafeError"

  /security/support-access/{accessId}/revoke:
    post:
      operationId: revokeSupportAccess
      parameters:
        - $ref: "#/components/parameters/AccessId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeSupportAccessRequest"
      responses:
        "200":
          description: Revoked support access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccessDetail"
        default:
          $ref: "#/components/responses/SafeError"

  /security/incidents/{incidentId}:
    get:
      operationId: getSecurityIncident
      parameters:
        - $ref: "#/components/parameters/IncidentId"
        - $ref: "#/components/parameters/Scenario"
      responses:
        "200":
          description: Security incident detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityIncidentDetail"
        default:
          $ref: "#/components/responses/SafeError"

  /security/incidents/{incidentId}/actions:
    post:
      operationId: actOnSecurityIncident
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityIncidentActionRequest"
      responses:
        "200":
          description: Updated security incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityIncidentDetail"
        default:
          $ref: "#/components/responses/SafeError"

  /audit-events:
    get:
      operationId: listAuditEvents
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/SortOrder"
        - $ref: "#/components/parameters/Scenario"
        - name: actorType
          in: query
          schema:
            $ref: "#/components/schemas/ActorType"
        - name: action
          in: query
          schema:
            type: string
            maxLength: 80
        - name: resourceType
          in: query
          schema:
            type: string
            maxLength: 64
        - name: result
          in: query
          schema:
            $ref: "#/components/schemas/EventResult"
        - name: severity
          in: query
          schema:
            $ref: "#/components/schemas/RiskLevel"
        - name: sort
          in: query
          schema:
            type: string
            enum: [occurred_at, severity, action, result]
      responses:
        "200":
          description: Immutable audit event page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        default:
          $ref: "#/components/responses/SafeError"

  /audit-events/{eventId}:
    get:
      operationId: getAuditEvent
      parameters:
        - $ref: "#/components/parameters/AuditEventId"
        - $ref: "#/components/parameters/Scenario"
      responses:
        "200":
          description: Immutable audit event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventDetail"
        default:
          $ref: "#/components/responses/SafeError"

  /data-requests/exports:
    get:
      operationId: listExportRequests
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/SortOrder"
        - $ref: "#/components/parameters/Scenario"
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/ExportRequestState"
        - name: sort
          in: query
          schema:
            type: string
            enum: [requested_at, completed_at, expires_at, state]
      responses:
        "200":
          description: Export request page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportRequestPage"
        default:
          $ref: "#/components/responses/SafeError"

  /data-requests/exports/{requestId}:
    get:
      operationId: getExportRequest
      parameters:
        - $ref: "#/components/parameters/ExportRequestId"
        - $ref: "#/components/parameters/Scenario"
      responses:
        "200":
          description: Export request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportRequestDetail"
        default:
          $ref: "#/components/responses/SafeError"

  /data-requests/exports/{requestId}/actions:
    post:
      operationId: actOnExportRequest
      parameters:
        - $ref: "#/components/parameters/ExportRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequestActionRequest"
      responses:
        "200":
          description: Updated export request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportRequestDetail"
        default:
          $ref: "#/components/responses/SafeError"

  /data-requests/exports/{requestId}/simulate-download:
    post:
      operationId: simulateExportDownload
      parameters:
        - $ref: "#/components/parameters/ExportRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulatedDownloadRequest"
      responses:
        "200":
          description: No-file download eligibility result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatedDownloadResult"
        default:
          $ref: "#/components/responses/SafeError"

  /data-requests/deletions:
    get:
      operationId: listDeletionRequests
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/SortOrder"
        - $ref: "#/components/parameters/Scenario"
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/DeletionRequestState"
        - name: sort
          in: query
          schema:
            type: string
            enum: [requested_at, scheduled_at, completed_at, state]
      responses:
        "200":
          description: Deletion request page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionRequestPage"
        default:
          $ref: "#/components/responses/SafeError"

  /data-requests/deletions/{requestId}:
    get:
      operationId: getDeletionRequest
      parameters:
        - $ref: "#/components/parameters/DeletionRequestId"
        - $ref: "#/components/parameters/Scenario"
      responses:
        "200":
          description: Deletion request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionRequestDetail"
        default:
          $ref: "#/components/responses/SafeError"

  /data-requests/deletions/{requestId}/actions:
    post:
      operationId: actOnDeletionRequest
      parameters:
        - $ref: "#/components/parameters/DeletionRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletionRequestActionRequest"
      responses:
        "200":
          description: Updated deletion request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionRequestDetail"
        default:
          $ref: "#/components/responses/SafeError"

  /data-retention/policies:
    get:
      operationId: listRetentionPolicies
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Scenario"
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/RetentionPolicyState"
        - name: protectedAuditPolicy
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Retention policy page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPolicyPage"
        default:
          $ref: "#/components/responses/SafeError"

  /data-retention/policies/{policyId}:
    get:
      operationId: getRetentionPolicy
      parameters:
        - $ref: "#/components/parameters/RetentionPolicyId"
        - $ref: "#/components/parameters/Scenario"
      responses:
        "200":
          description: Retention policy detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPolicyDetail"
        default:
          $ref: "#/components/responses/SafeError"
    patch:
      operationId: updateRetentionPolicy
      parameters:
        - $ref: "#/components/parameters/RetentionPolicyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionPolicyUpdateRequest"
      responses:
        "200":
          description: Updated mock retention policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPolicyDetail"
        default:
          $ref: "#/components/responses/SafeError"

components:
  parameters:
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 120
    Platform:
      name: platform
      in: query
      schema:
        $ref: "#/components/schemas/PlatformFilter"
    DateFrom:
      name: dateFrom
      in: query
      schema:
        type: string
        format: date-time
    DateTo:
      name: dateTo
      in: query
      schema:
        type: string
        format: date-time
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        enum: [25, 50, 100]
        default: 25
    SortOrder:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    Scenario:
      name: scenario
      in: query
      schema:
        $ref: "#/components/schemas/MockScenario"
    ActivityId:
      name: activityId
      in: path
      required: true
      schema:
        type: string
        pattern: "^SUS-[0-9]{4,6}$"
    AccessId:
      name: accessId
      in: path
      required: true
      schema:
        type: string
        pattern: "^SAC-[0-9]{4,6}$"
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        pattern: "^INC-[0-9]{4,6}$"
    AuditEventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        pattern: "^AUD-[0-9]{4,6}$"
    ExportRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        pattern: "^EXP-[0-9]{4,6}$"
    DeletionRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        pattern: "^DEL-[0-9]{4,6}$"
    RetentionPolicyId:
      name: policyId
      in: path
      required: true
      schema:
        type: string
        pattern: "^RET-[0-9]{4,6}$"

  responses:
    SafeError:
      description: Safe error without protected data or implementation detail
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    MockScenario:
      type: string
      enum:
        - default
        - empty
        - large
        - slow
        - partial
        - unauthorized
        - forbidden
        - not_found
        - validation_error
        - conflict
        - expired
        - rate_limited
        - unavailable
        - internal_error

    PlatformScope:
      type: string
      enum: [all, ios, android, unknown, global]

    PlatformFilter:
      type: string
      enum: [all, ios, android, unknown]

    ActorType:
      type: string
      enum: [customer, admin, system]

    RiskLevel:
      type: string
      enum: [informational, low, medium, high, critical]

    EventResult:
      type: string
      enum: [success, failure, denied, blocked]

    RegionState:
      type: object
      additionalProperties: false
      required: [availability]
      properties:
        availability:
          type: string
          enum: [available, empty, stale, partial, unavailable, forbidden]
        message:
          type: string
          maxLength: 240
        retryable:
          type: boolean

    SafeReference:
      type: object
      additionalProperties: false
      required: [id, kind, label]
      properties:
        id:
          type: string
          maxLength: 48
        kind:
          type: string
          enum:
            [customer, admin, device, session, ticket, incident, request,
             subscription, service]
        label:
          type: string
          maxLength: 160
        status:
          type: string
          maxLength: 40

    PaginationMeta:
      type: object
      additionalProperties: false
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          enum: [25, 50, 100]
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    PlatformMetric:
      type: object
      additionalProperties: false
      required: [key, label, value, unit, entitySemantic, freshness]
      properties:
        key:
          type: string
          maxLength: 64
        label:
          type: string
          maxLength: 120
        value:
          type: number
          minimum: 0
        unit:
          type: string
          enum: [events, sessions, accounts, grants, permission_changes, customers]
        entitySemantic:
          type: string
          enum: [event, session, account, grant, permission_change, unique_customer]
        ios:
          type: number
          minimum: 0
        android:
          type: number
          minimum: 0
        unknown:
          type: number
          minimum: 0
        freshness:
          type: string
          format: date-time

    SecurityOverview:
      type: object
      additionalProperties: false
      required: [metrics, region]
      properties:
        metrics:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/PlatformMetric"
        region:
          $ref: "#/components/schemas/RegionState"

    AuthenticationEventSummary:
      type: object
      additionalProperties: false
      required:
        [id, actor, actorType, eventType, deviceLabel, region, platform, risk,
         occurredAt, result, correlationId]
      properties:
        id:
          type: string
          pattern: "^AUTH-[0-9]{4,6}$"
        actor:
          $ref: "#/components/schemas/SafeReference"
        actorType:
          $ref: "#/components/schemas/ActorType"
        eventType:
          type: string
          maxLength: 64
        deviceLabel:
          type: string
          maxLength: 120
        region:
          type: string
          maxLength: 64
        platform:
          $ref: "#/components/schemas/PlatformScope"
        appVersion:
          type: string
          maxLength: 24
        risk:
          $ref: "#/components/schemas/RiskLevel"
        occurredAt:
          type: string
          format: date-time
        result:
          $ref: "#/components/schemas/EventResult"
        correlationId:
          type: string
          pattern: "^[A-Z0-9-]{12,48}$"

    AuthenticationEventPage:
      type: object
      additionalProperties: false
      required: [items, pagination, region]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AuthenticationEventSummary"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
        region:
          $ref: "#/components/schemas/RegionState"

    SuspiciousActivityState:
      type: string
      enum: [new, investigating, escalated, resolved, dismissed]

    SuspiciousActivityDetail:
      type: object
      additionalProperties: false
      required:
        [id, actor, eventLabel, riskScore, signals, platform, state, timeline,
         revision, allowedActions, createdAt, updatedAt]
      properties:
        id:
          type: string
          pattern: "^SUS-[0-9]{4,6}$"
        actor:
          $ref: "#/components/schemas/SafeReference"
        eventLabel:
          type: string
          maxLength: 160
        riskScore:
          type: integer
          minimum: 0
          maximum: 100
        signals:
          type: array
          maxItems: 12
          items:
            type: string
            maxLength: 120
        platform:
          $ref: "#/components/schemas/PlatformScope"
        appVersion:
          type: string
          maxLength: 24
        reviewer:
          $ref: "#/components/schemas/SafeReference"
        incident:
          $ref: "#/components/schemas/SafeReference"
        state:
          $ref: "#/components/schemas/SuspiciousActivityState"
        timeline:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/TimelineEntry"
        revision:
          type: integer
          minimum: 1
        allowedActions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [assign_reviewer, investigate, escalate, resolve, dismiss]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SuspiciousActivityPage:
      type: object
      additionalProperties: false
      required: [items, pagination, region]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/SuspiciousActivityDetail"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
        region:
          $ref: "#/components/schemas/RegionState"

    SuspiciousActivityActionRequest:
      type: object
      additionalProperties: false
      required: [action, expectedState, expectedRevision, confirmationToken]
      properties:
        action:
          type: string
          enum: [assign_reviewer, investigate, escalate, resolve, dismiss]
        reviewerId:
          type: string
          maxLength: 48
        incidentId:
          type: string
          pattern: "^INC-[0-9]{4,6}$"
        reason:
          type: string
          maxLength: 2048
        expectedState:
          $ref: "#/components/schemas/SuspiciousActivityState"
        expectedRevision:
          type: integer
          minimum: 1
        confirmationToken:
          type: string
          const: mock-confirmed

    TwoFactorState:
      type: string
      enum: [enabled, disabled, recovery_required]

    AdminSecuritySummary:
      type: object
      additionalProperties: false
      required: [admin, role, twoFactorState, lastLoginAt, activeSessionCount, risk]
      properties:
        admin:
          $ref: "#/components/schemas/SafeReference"
        role:
          type: string
          maxLength: 64
        twoFactorState:
          $ref: "#/components/schemas/TwoFactorState"
        lastLoginAt:
          type: string
          format: date-time
        activeSessionCount:
          type: integer
          minimum: 0
        risk:
          $ref: "#/components/schemas/RiskLevel"

    AdminSecurityPage:
      type: object
      additionalProperties: false
