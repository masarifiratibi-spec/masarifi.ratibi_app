openapi: 3.1.0
info:
  title: Masarifi Admin Users and Controlled Access Frontend Contract
  version: 0.1.0
  description: >
    Replaceable frontend/MSW contract for Phase 2 Spec 003. It defines
    privacy-safe projections and mock operations only; it does not create a
    backend, production identity, or authorization boundary.
servers:
  - url: /
    description: Same-origin frontend mock boundary
tags:
  - name: Admin Users
  - name: Controlled Access

paths:
  /api/v1/admin/users:
    get:
      tags: [Admin Users]
      operationId: listAdminUsers
      summary: List unique privacy-safe customers
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/AccountStatus"
        - $ref: "#/components/parameters/Plan"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Language"
        - $ref: "#/components/parameters/RegisteredFrom"
        - $ref: "#/components/parameters/RegisteredTo"
        - $ref: "#/components/parameters/LastActiveFrom"
        - $ref: "#/components/parameters/LastActiveTo"
        - $ref: "#/components/parameters/PlatformFilter"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Verification"
        - $ref: "#/components/parameters/Risk"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/MockRole"
        - $ref: "#/components/parameters/Scenario"
      responses:
        "200":
          description: Paginated unique customer summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersPage"
        "400":
          $ref: "#/components/responses/SafeError"
        "401":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "429":
          $ref: "#/components/responses/SafeError"
        "500":
          $ref: "#/components/responses/SafeError"
        "503":
          $ref: "#/components/responses/SafeError"

  /api/v1/admin/users/bulk-actions:
    post:
      tags: [Admin Users]
      operationId: runAdminUserBulkAction
      summary: Apply an action to explicitly selected customers
      parameters:
        - $ref: "#/components/parameters/MockRole"
        - $ref: "#/components/parameters/Scenario"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserBulkActionRequest"
      responses:
        "200":
          description: Complete or partial bulk outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBulkActionResult"
        "400":
          $ref: "#/components/responses/SafeError"
        "401":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "409":
          $ref: "#/components/responses/SafeError"
        "422":
          $ref: "#/components/responses/SafeError"
        "429":
          $ref: "#/components/responses/SafeError"
        "500":
          $ref: "#/components/responses/SafeError"

  /api/v1/admin/users/{userId}:
    get:
      tags: [Admin Users]
      operationId: getAdminUserProfile
      summary: Get a privacy-safe customer profile
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/MockRole"
        - $ref: "#/components/parameters/Scenario"
      responses:
        "200":
          description: Privacy-safe profile summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileSummary"
        "400":
          $ref: "#/components/responses/SafeError"
        "401":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "404":
          $ref: "#/components/responses/SafeError"
        "500":
          $ref: "#/components/responses/SafeError"

  /api/v1/admin/users/{userId}/devices:
    get:
      tags: [Admin Users]
      operationId: listAdminUserDevices
      summary: List sanitized registered devices
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/MockRole"
        - $ref: "#/components/parameters/Scenario"
      responses:
        "200":
          description: Device summaries and additive counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDevicesResponse"
        "400":
          $ref: "#/components/responses/SafeError"
        "401":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "404":
          $ref: "#/components/responses/SafeError"
        "500":
          $ref: "#/components/responses/SafeError"

  /api/v1/admin/users/{userId}/sessions:
    get:
      tags: [Admin Users]
      operationId: listAdminUserSessions
      summary: List sanitized customer sessions
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/MockRole"
        - $ref: "#/components/parameters/Scenario"
      responses:
        "200":
          description: Session summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSessionsResponse"
        "400":
          $ref: "#/components/responses/SafeError"
        "401":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "404":
          $ref: "#/components/responses/SafeError"
        "500":
          $ref: "#/components/responses/SafeError"

  /api/v1/admin/users/{userId}/suspend:
    post:
      tags: [Admin Users]
      operationId: suspendAdminUser
      summary: Suspend a customer after scoped confirmation
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/MockRole"
        - $ref: "#/components/parameters/Scenario"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendUserRequest"
      responses:
        "200":
          $ref: "#/components/responses/UserActionSuccess"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "404":
          $ref: "#/components/responses/SafeError"
        "409":
          $ref: "#/components/responses/SafeError"
        "422":
          $ref: "#/components/responses/SafeError"
        "429":
          $ref: "#/components/responses/SafeError"

  /api/v1/admin/users/{userId}/reactivate:
    post:
      tags: [Admin Users]
      operationId: reactivateAdminUser
      summary: Reactivate a suspended customer
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/MockRole"
        - $ref: "#/components/parameters/Scenario"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactivateUserRequest"
      responses:
        "200":
          $ref: "#/components/responses/UserActionSuccess"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "404":
          $ref: "#/components/responses/SafeError"
        "409":
          $ref: "#/components/responses/SafeError"
        "422":
          $ref: "#/components/responses/SafeError"
        "429":
          $ref: "#/components/responses/SafeError"

  /api/v1/admin/users/{userId}/verification:
    post:
      tags: [Admin Users]
      operationId: updateAdminUserVerification
      summary: Update the customer verification state
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/MockRole"
        - $ref: "#/components/parameters/Scenario"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVerificationRequest"
      responses:
        "200":
          $ref: "#/components/responses/UserActionSuccess"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "404":
          $ref: "#/components/responses/SafeError"
        "409":
          $ref: "#/components/responses/SafeError"
        "422":
          $ref: "#/components/responses/SafeError"
        "429":
          $ref: "#/components/responses/SafeError"

  /api/v1/admin/users/{userId}/devices/{deviceId}/revoke:
    post:
      tags: [Admin Users]
      operationId: revokeAdminUserDevice
      summary: Revoke one registered device
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/MockRole"
        - $ref: "#/components/parameters/Scenario"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeDeviceRequest"
      responses:
        "200":
          $ref: "#/components/responses/DeviceActionSuccess"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "404":
          $ref: "#/components/responses/SafeError"
        "409":
          $ref: "#/components/responses/SafeError"
        "422":
          $ref: "#/components/responses/SafeError"
        "429":
          $ref: "#/components/responses/SafeError"

  /api/v1/admin/users/{userId}/sessions/revoke:
    post:
      tags: [Admin Users]
      operationId: revokeAdminUserSessions
      summary: Revoke selected or all active sessions
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/MockRole"
        - $ref: "#/components/parameters/Scenario"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeSessionsRequest"
      responses:
        "200":
          $ref: "#/components/responses/SessionActionSuccess"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "404":
          $ref: "#/components/responses/SafeError"
        "409":
          $ref: "#/components/responses/SafeError"
        "422":
          $ref: "#/components/responses/SafeError"
        "429":
          $ref: "#/components/responses/SafeError"

  /api/v1/admin/access-requests:
    get:
      tags: [Controlled Access]
      operationId: listAdminAccessRequests
      summary: List requests visible to the simulated operator
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/AccessStatus"
        - $ref: "#/components/parameters/Assignee"
        - $ref: "#/components/parameters/MockRole"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Scenario"
      responses:
        "200":
          description: Paginated access-request summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequestsPage"
        "400":
          $ref: "#/components/responses/SafeError"
        "401":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "429":
          $ref: "#/components/responses/SafeError"
        "500":
          $ref: "#/components/responses/SafeError"
    post:
      tags: [Controlled Access]
      operationId: createAdminAccessRequest
      summary: Request narrow time-limited support access
      parameters:
        - $ref: "#/components/parameters/MockRole"
        - $ref: "#/components/parameters/Scenario"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccessRequest"
      responses:
        "201":
          description: Pending access request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequestDetail"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "404":
          $ref: "#/components/responses/SafeError"
        "409":
          $ref: "#/components/responses/SafeError"
        "422":
          $ref: "#/components/responses/SafeError"
        "429":
          $ref: "#/components/responses/SafeError"

  /api/v1/admin/access-requests/{requestId}:
    get:
      tags: [Controlled Access]
      operationId: getAdminAccessRequest
      summary: Get request, masking, and lifecycle details
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/MockRole"
        - $ref: "#/components/parameters/Scenario"
      responses:
        "200":
          description: Controlled access request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequestDetail"
        "400":
          $ref: "#/components/responses/SafeError"
        "401":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "404":
          $ref: "#/components/responses/SafeError"
        "500":
          $ref: "#/components/responses/SafeError"

  /api/v1/admin/access-requests/{requestId}/decision:
    post:
      tags: [Controlled Access]
      operationId: decideAdminAccessRequest
      summary: Approve with equal/reduced scope or reject
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/MockRole"
        - $ref: "#/components/parameters/Scenario"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessDecisionRequest"
      responses:
        "200":
          description: Updated access request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequestDetail"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "404":
          $ref: "#/components/responses/SafeError"
        "409":
          $ref: "#/components/responses/SafeError"
        "422":
          $ref: "#/components/responses/SafeError"
        "429":
          $ref: "#/components/responses/SafeError"

  /api/v1/admin/access-requests/{requestId}/revoke:
    post:
      tags: [Controlled Access]
      operationId: revokeAdminAccessRequest
      summary: Revoke approved or active access
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/MockRole"
        - $ref: "#/components/parameters/Scenario"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeAccessRequest"
      responses:
        "200":
          description: Revoked access request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequestDetail"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "404":
          $ref: "#/components/responses/SafeError"
        "409":
          $ref: "#/components/responses/SafeError"
        "422":
          $ref: "#/components/responses/SafeError"
        "429":
          $ref: "#/components/responses/SafeError"

  /api/v1/admin/access-requests/{requestId}/workspace:
    get:
      tags: [Controlled Access]
      operationId: getAdminTemporaryWorkspace
      summary: Get only the active assignee-bound workspace projection
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/MockRole"
        - $ref: "#/components/parameters/Scenario"
      responses:
        "200":
          description: Active masked and scope-limited workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryWorkspace"
        "400":
          $ref: "#/components/responses/SafeError"
        "401":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "404":
          $ref: "#/components/responses/SafeError"
        "409":
          $ref: "#/components/responses/SafeError"
        "410":
          $ref: "#/components/responses/SafeError"
        "429":
          $ref: "#/components/responses/SafeError"

  /api/v1/admin/access-requests/{requestId}/end:
    post:
      tags: [Controlled Access]
      operationId: endAdminTemporaryAccess
      summary: End the assignee's active access
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/MockRole"
        - $ref: "#/components/parameters/Scenario"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndTemporaryAccessRequest"
      responses:
        "200":
          description: Access ended and workspace invalidated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndTemporaryAccessResult"
        "400":
          $ref: "#/components/responses/SafeError"
        "403":
          $ref: "#/components/responses/SafeError"
        "404":
          $ref: "#/components/responses/SafeError"
        "409":
          $ref: "#/components/responses/SafeError"
        "422":
          $ref: "#/components/responses/SafeError"
        "429":
          $ref: "#/components/responses/SafeError"

components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UserId"
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/DeviceId"
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AccessRequestId"
    Search:
      name: query
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 100
    AccountStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/AccountStatus"
    Plan:
      name: plan
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Plan"
    Country:
      name: country
      in: query
      required: false
      schema:
        enum: [SA, AE]
    Language:
      name: language
      in: query
      required: false
      schema:
        enum: [ar, en]
    RegisteredFrom:
      name: registeredFrom
      in: query
      required: false
      schema:
        type: string
        format: date
    RegisteredTo:
      name: registeredTo
      in: query
      required: false
      schema:
        type: string
        format: date
    LastActiveFrom:
      name: lastActiveFrom
      in: query
      required: false
      schema:
        type: string
        format: date-time
    LastActiveTo:
      name: lastActiveTo
      in: query
      required: false
      schema:
        type: string
        format: date-time
    PlatformFilter:
      name: platform
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/PlatformFilter"
    AppVersion:
      name: appVersion
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 32
    Verification:
      name: verification
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/VerificationState"
    Risk:
      name: risk
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/RiskLevel"
    Sort:
      name: sort
      in: query
      required: false
      schema:
        enum: [name, registeredAt, lastActive, risk]
        default: lastActive
    Order:
      name: order
      in: query
      required: false
      schema:
        enum: [asc, desc]
        default: desc
    AccessStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/AccessStatus"
    Assignee:
      name: assignee
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 48
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        enum: [25, 50, 100]
        default: 25
    MockRole:
      name: role
      in: query
      required: false
      description: >
        Development-only role simulation. A future backend derives identity and
        authorization from its authenticated server context and ignores this
        client-supplied value. The mock maps each role to one stable fictional
        Admin actor ID for requester, approver, and assignee checks.
      schema:
        $ref: "#/components/schemas/AdminRole"
    Scenario:
      name: __scenario
      in: query
      required: false
      description: Development-only mock scenario selector.
      schema:
        type: string
        maxLength: 40

  responses:
    SafeError:
      description: Safe error without stack, secret, or private payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UserActionSuccess:
      description: Validated customer/device/session action result
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserActionResult"
    DeviceActionSuccess:
      description: Validated device revocation result
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DeviceActionResult"
    SessionActionSuccess:
      description: Validated session revocation result
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessionActionResult"

  schemas:
    UserId:
      type: string
      pattern: "^USR-[A-Z0-9-]{1,44}$"
      maxLength: 48
    DeviceId:
      type: string
      pattern: "^DEV-[A-Z0-9-]{1,44}$"
      maxLength: 48
    SessionId:
      type: string
      pattern: "^SES-[A-Z0-9-]{1,44}$"
      maxLength: 48
    AccessRequestId:
      type: string
      pattern: "^ACC-[A-Z0-9-]{1,44}$"
      maxLength: 48
    TicketId:
      type: string
      pattern: "^TKT-[A-Z0-9-]{1,44}$"
      maxLength: 48
    AuditReference:
      type: string
      pattern: "^AUD-[A-Z0-9-]{1,44}$"
      maxLength: 48
    AdminRole:
      type: string
      enum:
        - super-admin
        - support-agent
        - billing-operator
        - import-operator
        - ai-operator
        - content-manager
        - security-administrator
    Platform:
      type: string
      enum: [ios, android]
    PlatformFilter:
      type: string
      enum: [all, ios, android, multi]
      default: all
    AccountStatus:
      type: string
      enum: [active, suspended, pending]
    VerificationState:
      type: string
      enum: [verified, pending]
    RiskLevel:
      type: string
      enum: [low, medium, high]
    Plan:
      type: string
      enum: [Free, Basic, Premium]
    CapabilityState:
      type: string
      enum: [enabled, disabled, denied, unavailable, unknown, not-applicable]
    DeviceState:
      type: string
      enum: [active, revoked]
    SessionState:
      type: string
      enum: [active, expired, revoked]
    AccessStatus:
      type: string
      enum: [pending, approved, active, expired, rejected, revoked]
    AccessScope:
      type: string
      enum:
        - profile-contact
        - account-status
        - device-diagnostics
        - session-diagnostics
        - subscription-summary
        - import-summary
    RegionAvailability:
      type: string
      enum: [available, empty, partial, stale, unavailable, forbidden]
    RegionState:
      type: object
      additionalProperties: false
      required: [availability]
      properties:
        availability:
          $ref: "#/components/schemas/RegionAvailability"
        message:
          type: string
          maxLength: 240
        retryable:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    Pagination:
      type: object
      additionalProperties: false
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          enum: [25, 50, 100]
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    AdminUserListItem:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - maskedEmail
        - country
        - language
        - primaryPlatform
        - registeredPlatforms
        - iosDeviceCount
        - androidDeviceCount
        - totalDeviceCount
        - plan
        - status
        - verification
        - registeredAt
        - lastActiveAt
        - risk
      properties:
        id:
          $ref: "#/components/schemas/UserId"
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        maskedEmail:
