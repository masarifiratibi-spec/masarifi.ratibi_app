# Proposed new virtual host only. DNS/certificate creation and reload need approval.
# Do not replace the retained staging virtual hosts or route-specific upstreams.
server {
    listen 80;
    listen [::]:80;
    server_name api.masarifiratibi.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/masarifi-production-acme;
    }
    location / {
        return 301 https://api.masarifiratibi.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.masarifiratibi.com;

    ssl_certificate /etc/letsencrypt/live/api.masarifiratibi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.masarifiratibi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 20m;

    location = /api/v1/tracking/device/rule-snapshot {
        proxy_pass http://127.0.0.1:3080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/v1/tracking/device/ { return 404; }
    location = /dev-privacy { return 404; }
    location ^~ /dev-privacy/ { return 404; }
    location = /dev-account-deletion { return 404; }
    location ^~ /dev-account-deletion/ { return 404; }
    location = /account-deletion { return 404; }
    location ^~ /account-deletion/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }
}
