# Replace the corresponding blocks in the retained Staging virtual host;
# do not include alongside duplicate existing location blocks.
# Original complete effective configuration SHA256:
# b61f04efa6f90533354705a1e4f8cdd4b6c68d77433449189d505eccf50ae35b
# Ordinary financial routes, existing consumers and account-deletion recovery stay intact.
location = /api/v1/tracking/device/rule-snapshot {
    proxy_pass http://127.0.0.1:3080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /api/v1/tracking/device/ { return 404; }
location ^~ /dev-privacy/ { return 404; }
location = /dev-account-deletion/api/v1/me/deletion-requests { return 404; }
location ^~ /dev-account-deletion/api/v1/privacy/deletion-completions/ { return 404; }
