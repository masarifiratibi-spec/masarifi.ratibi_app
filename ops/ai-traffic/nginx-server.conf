# Include in the production HTTPS API server after verifying location inheritance.
limit_conn masarifi_ai_sockets 60;
limit_conn masarifi_ai_uploads 10;
limit_conn_dry_run off;
limit_conn_status 429;
limit_conn_log_level warn;
limit_req zone=masarifi_ai_edge burst=12 nodelay;
limit_req_dry_run off;
limit_req_log_level warn;
limit_req_status 429;
error_page 429 = @masarifi_ai_busy;
location @masarifi_ai_busy {
    default_type application/json;
    add_header X-Masarifi-AI-Limit traffic always;
    add_header Retry-After 1 always;
    add_header Cache-Control no-store always;
    return 429 '{"code":"AI_TRAFFIC_LIMITED"}';
}
