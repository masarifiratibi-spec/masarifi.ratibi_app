# Include once in http {}. Only the production API vhost uses this zone.
map $uri $masarifi_ai_ip {
    default "";
    ~*^/api/v1/(assistant|voice)(/|$) $binary_remote_addr;
}
map "$request_method:$uri" $masarifi_ai_upload_ip {
    default "";
    ~*^PUT:/api/v1/voice/sessions/[^/]+/audio/?$ $binary_remote_addr;
}
map "$request_method:$uri" $masarifi_ai_connection_ip {
    default $masarifi_ai_ip;
    ~*^POST:/api/v1/voice/sessions/[^/]+/cancel/?$ "";
}
limit_conn_zone $masarifi_ai_connection_ip zone=masarifi_ai_sockets:10m;
limit_conn_zone $masarifi_ai_upload_ip zone=masarifi_ai_uploads:5m;
limit_req_zone $masarifi_ai_ip zone=masarifi_ai_edge:10m rate=60r/s;

map "$host:$uri" $masarifi_ai_category {
    default "";
    ~*^api\.masarifiratibi\.com:/api/v1/assistant/ chat;
    ~*^api\.masarifiratibi\.com:/api/v1/voice/ voice;
}
log_format masarifi_ai_shadow '$msec $masarifi_ai_category $status $limit_req_status $limit_conn_status';
access_log /var/log/nginx/masarifi-ai-shadow.log masarifi_ai_shadow if=$masarifi_ai_category;
