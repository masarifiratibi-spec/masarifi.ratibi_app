name: iOS Native Qualification

on:
  push:
    branches: [iOS]
    paths:
      - .github/workflows/ios-native-qualification.yml
      - apps/mobile/modules/masarifi-bank-sms/ios/BankSmsSavedNotice.swift
      - apps/mobile/scripts/fixtures/bank-sms-saved-notice.swift
      - apps/mobile/scripts/test-bank-sms-notification.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
      - name: Check native notice formatting and text direction
        env:
          EAS_BUILD_PLATFORM: ios
        run: node apps/mobile/scripts/test-bank-sms-notification.cjs
