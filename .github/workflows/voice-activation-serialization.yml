name: Voice Activation Serialization Qualification
on:
  workflow_dispatch:
  push:
    branches: [codex/voice-activation-serialization-2026-10-13]
permissions:
  contents: read
jobs:
  disposable-activation:
    if: github.repository == 'masarifiratibi-spec/masarifi.ratibi_app' && github.ref == 'refs/heads/codex/voice-activation-serialization-2026-10-13'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CROSS_FEATURE_DISPOSABLE_DATABASE_NAME: postgres
      MASARIFI_LIVE_DATABASE_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: apps/api/.nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: node --test scripts/staging-voice/diagnostic-canary/canary-db.test.cjs
      - run: python3 -m unittest discover -s scripts/staging-voice/diagnostic-canary -p 'test_*.py' -v
      - run: python3 -O -m unittest discover -s scripts/staging-voice/diagnostic-canary -p 'test_*.py' -v
      - run: npm --prefix apps/api ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix apps/api run supabase:start
      - run: npm --prefix apps/api run db:reset
      - name: Reproduce actual heartbeat serialization races and verify full controller financial boundaries
        shell: bash
        run: |
          set -euo pipefail
          node scripts/staging-voice/diagnostic-canary/qualify-activation.cjs | tee "$RUNNER_TEMP/activation-serialization.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: voice-activation-serialization-${{ github.sha }}
          path: ${{ runner.temp }}/activation-serialization.json
          if-no-files-found: error
      - run: npm --prefix apps/api run supabase:stop
        if: always()
