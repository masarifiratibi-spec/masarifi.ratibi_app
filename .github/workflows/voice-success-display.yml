name: Voice Success Display Qualification
on:
  workflow_dispatch:
  push:
    branches: [codex/voice-promoted-operating-2026-10-13]
    paths:
      - apps/mobile/src/features/voice/VoiceBatchStatus.tsx
      - apps/mobile/src/features/voice/useVoiceBatches.test.tsx
      - apps/mobile/src/features/voice/VoiceEventResults.test.tsx
      - apps/mobile/src/features/voice/VoiceBatchStatus.test.tsx
      - .github/workflows/voice-success-display.yml
permissions:
  contents: read
jobs:
  mobile-display:
    if: github.repository == 'masarifiratibi-spec/masarifi.ratibi_app' && github.ref == 'refs/heads/codex/voice-promoted-operating-2026-10-13'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: apps/api/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm --prefix apps/mobile ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix apps/mobile run typecheck
      - working-directory: apps/mobile
        run: npx eslint src/features/voice/VoiceBatchStatus.tsx src/features/voice/useVoiceBatches.test.tsx src/features/voice/VoiceEventResults.test.tsx
      - working-directory: apps/mobile
        run: npx jest --runInBand --runTestsByPath src/features/voice/useVoiceBatches.test.tsx src/features/voice/voice-transaction-visibility.test.tsx src/features/voice/voice-analysis-result.test.tsx src/features/voice/VoiceEventResults.test.tsx src/features/voice/VoiceBatchStatus.test.tsx src/features/home/HomeScreen.test.tsx --json --outputFile=${{ runner.temp }}/voice-success-display.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: voice-success-display-${{ github.sha }}
          path: ${{ runner.temp }}/voice-success-display.json
          if-no-files-found: error
