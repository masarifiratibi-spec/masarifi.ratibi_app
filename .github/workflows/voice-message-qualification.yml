name: Voice Message and Heartbeat Qualification
on:
  workflow_dispatch:
  push:
    branches: [codex/voice-promoted-operating-2026-10-13]
    paths:
      - apps/api/src/ai/staging-voice.worker.ts
      - apps/api/test/unit/ai/staging-voice-worker.spec.ts
      - apps/api/test/integration/ai/staging-voice-epoch.spec.ts
      - apps/api/src/ai/voice-batch.ts
      - apps/api/test/unit/ai/voice-batch.spec.ts
      - apps/api/test/integration/ai/voice-batch.spec.ts
      - apps/mobile/src/features/voice/useVoiceBatches.ts
      - apps/mobile/src/features/voice/useVoiceBatches.test.tsx
      - apps/mobile/src/features/voice/VoiceAnalysisResults.tsx
      - apps/mobile/src/features/voice/voice-transaction-visibility.test.tsx
      - .github/workflows/voice-message-qualification.yml
permissions:
  contents: read
jobs:
  regression:
    if: github.repository == 'masarifiratibi-spec/masarifi.ratibi_app' && github.ref == 'refs/heads/codex/voice-promoted-operating-2026-10-13'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: apps/api/.nvmrc
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/mobile/package-lock.json
      - run: npm --prefix apps/api ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix apps/mobile ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix apps/api run typecheck && npm --prefix apps/mobile run typecheck
      - working-directory: apps/api
        run: npx eslint src/ai/staging-voice.worker.ts src/ai/voice-batch.ts test/unit/ai/staging-voice-worker.spec.ts test/unit/ai/voice-batch.spec.ts test/integration/ai/staging-voice-epoch.spec.ts test/integration/ai/voice-batch.spec.ts
      - working-directory: apps/mobile
        run: npx eslint src/features/voice/VoiceAnalysisResults.tsx src/features/voice/voice-transaction-visibility.test.tsx src/features/voice/useVoiceBatches.ts src/features/voice/useVoiceBatches.test.tsx
      - working-directory: apps/api
        env:
          MASARIFI_LIVE_DATABASE_TESTS: '0'
          DATABASE_URL: postgresql://test:test@127.0.0.1:1/test
        run: npx jest --selectProjects unit integration --runInBand --testPathPatterns='test/unit/ai/|test/integration/database/pool.service.spec.ts|test/unit/observability/worker-error.spec.ts' --json --outputFile=${{ runner.temp }}/voice-message-api.json
      - working-directory: apps/mobile
        run: npx jest --runInBand --runTestsByPath src/features/voice/voice-transaction-visibility.test.tsx src/features/voice/useVoiceBatches.test.tsx src/features/voice/voice-analysis-result.test.tsx src/features/voice/VoiceBatchStatus.test.tsx src/features/voice/VoiceEventResults.test.tsx src/features/voice/VoiceCaptureScreen.test.tsx src/features/home/HomeScreen.test.tsx --json --outputFile=${{ runner.temp }}/voice-message-mobile.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: voice-message-regression-${{ github.sha }}
          path: ${{ runner.temp }}/voice-message-*.json
          if-no-files-found: warn
  disposable-database:
    if: github.repository == 'masarifiratibi-spec/masarifi.ratibi_app' && github.ref == 'refs/heads/codex/voice-promoted-operating-2026-10-13'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      MASARIFI_LIVE_DATABASE_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: apps/api/.nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm --prefix apps/api ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix apps/api run supabase:start
      - run: npm --prefix apps/api run db:reset
      - name: Verify repeated heartbeats, closed epochs, duplicate prevention and legacy exclusions
        working-directory: apps/api
        run: npx jest --selectProjects integration --runInBand --runTestsByPath test/integration/ai/staging-voice-epoch.spec.ts test/integration/ai/voice-batch.spec.ts --json --outputFile=${{ runner.temp }}/voice-message-database.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: voice-message-database-${{ github.sha }}
          path: ${{ runner.temp }}/voice-message-database.json
          if-no-files-found: warn
      - run: npm --prefix apps/api run supabase:stop
        if: always()
