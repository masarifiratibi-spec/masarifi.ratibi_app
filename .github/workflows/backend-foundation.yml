name: Staging Candidate Compatibility Verification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact application candidate SHA
        required: true
        type: string
      image:
        description: Scanned backend image pinned by digest
        required: true
        type: string
      foundation_run:
        description: Successful full exact-commit CI run
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CROSS_FEATURE_DISPOSABLE_DATABASE_NAME: postgres
      MASARIFI_LIVE_DATABASE_TESTS: "1"
      SOURCE_SHA: ${{ inputs.source_sha }}
      CANDIDATE_IMAGE: ${{ inputs.image }}
      FOUNDATION_RUN: ${{ inputs.foundation_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
      - name: Verify exact application source and completed foundation gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CANDIDATE_IMAGE" =~ ^ghcr\.io/masarifiratibi-spec/masarifi-backend@sha256:[a-f0-9]{64}$ ]]
          [[ "$FOUNDATION_RUN" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FOUNDATION_RUN" > /tmp/foundation.json
          jq -e --arg sha "$SOURCE_SHA" '.head_sha==$sha and .status=="completed" and .conclusion=="success"' /tmp/foundation.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: apps/api/.nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm --prefix apps/api ci --ignore-scripts
      - name: Verify the immutable container identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$CANDIDATE_IMAGE"
          test "$(docker image inspect "$CANDIDATE_IMAGE" --format '{{.Config.User}}')" = '65532:65532'
          test "$(docker image inspect "$CANDIDATE_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          docker image inspect "$CANDIDATE_IMAGE" --format '{{json .RepoDigests}}' > /tmp/immutable-image.json
      - name: Start an isolated disposable database
        run: npm --prefix apps/api run supabase:start
      - name: Collect all nine controlled cross-feature compatibility cases
        run: node scripts/staging-voice/collect-compatibility.cjs "$SOURCE_SHA" "$CANDIDATE_IMAGE" .superpowers/staging-image-compatibility
      - name: Compare declared contracts from the actual container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint /nodejs/bin/node "$CANDIDATE_IMAGE" -e 'const {HealthController}=require("./dist/src/platform/health/health.controller");process.stdout.write(JSON.stringify(new HealthController({}).compatibility().contracts));' > /tmp/image-contracts.json
          node -e 'const fs=require("node:fs"),assert=require("node:assert/strict");assert.deepEqual(JSON.parse(fs.readFileSync("/tmp/image-contracts.json")),JSON.parse(fs.readFileSync(".superpowers/staging-image-compatibility/compatibility.json")).contracts);'
          cp /tmp/immutable-image.json /tmp/image-contracts.json .superpowers/staging-image-compatibility/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: staging-${{ inputs.source_sha }}-image-compatibility
          path: .superpowers/staging-image-compatibility/
          if-no-files-found: error
          retention-days: 14
      - name: Stop only the disposable runner database
        if: always()
        run: npm --prefix apps/api run supabase:stop
