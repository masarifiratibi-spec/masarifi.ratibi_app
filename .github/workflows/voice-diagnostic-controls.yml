name: Voice Diagnostic Deployment Controls
on:
  workflow_dispatch:
  push:
    branches: [codex/voice-diagnostic-controls-2026-10-13]
permissions:
  contents: read
jobs:
  offline-host-controls:
    if: github.repository == 'masarifiratibi-spec/masarifi.ratibi_app' && github.ref == 'refs/heads/codex/voice-diagnostic-controls-2026-10-13'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test preservation-only OFF controls and reused-API ON controls without network access
        run: |
          python3 -m unittest discover -s scripts/staging-voice/diagnostic-off -p 'test_*.py' -v
          python3 -O -m unittest discover -s scripts/staging-voice/diagnostic-off -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/staging-voice/diagnostic-canary -p 'test_*.py' -v
          python3 -O -m unittest discover -s scripts/staging-voice/diagnostic-canary -p 'test_*.py' -v
  disposable-controls:
    if: github.repository == 'masarifiratibi-spec/masarifi.ratibi_app' && github.ref == 'refs/heads/codex/voice-diagnostic-controls-2026-10-13'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CROSS_FEATURE_DISPOSABLE_DATABASE_NAME: postgres
      MASARIFI_LIVE_DATABASE_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: apps/api/.nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm --prefix apps/api ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/staging-voice/diagnostic-migration.test.cjs
      - run: npm --prefix apps/api run supabase:start
      - run: npm --prefix apps/api run db:reset
      - name: Verify the actual installer transaction, failure rollback and concurrent lock
        shell: bash
        run: |
          set -euo pipefail
          node scripts/staging-voice/qualify-diagnostic-migration.cjs | tee "$RUNNER_TEMP/diagnostic-installer.json"
      - name: Verify actual SQL boundaries after the installer
        run: npm --prefix apps/api run test:integration -- --runTestsByPath test/integration/ai/staging-voice-epoch.spec.ts --json --outputFile=${{ runner.temp }}/diagnostic-controls-database.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: voice-diagnostic-controls-${{ github.sha }}
          path: |
            ${{ runner.temp }}/diagnostic-installer.json
            ${{ runner.temp }}/diagnostic-controls-database.json
          if-no-files-found: error
      - run: npm --prefix apps/api run supabase:stop
        if: always()
